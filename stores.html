<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Find stores near you — LOYALTY</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f5f5f5;font:17px/1.5 Arial,sans-serif}main{max-width:900px;margin:auto;padding:28px 20px}a{color:#e7c36f}h1{font-size:38px;line-height:1.15}p{color:#b7bfcc}form,.store{background:#fff;color:#162031;border-radius:20px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 6px;font-weight:bold}input,button{font:inherit;padding:13px;border-radius:10px;max-width:100%}input:not([type=checkbox]){width:100%;border:1px solid #a7adba}button{background:#e7c36f;color:#111;border:0;font-weight:bold;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}.store p{color:#4b5563}.store a{color:#755006}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.store{margin:0}.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}:focus-visible{outline:3px solid #b98116;outline-offset:3px}@media(max-width:480px){.row{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a href="index.html">LOYALTY · Home</a><h1>Discover rewards close to home.</h1><p>Find participating stores in your city. No account or QR scan needed to explore.</p><form id="search"><div class="row"><div><label for="city">City or town</label><input id="city" required maxlength="100" autocomplete="address-level2" placeholder="e.g. Huntington"></div><div><label for="state">US state code</label><input id="state" required pattern="[A-Za-z]{2}" maxlength="2" autocomplete="address-level1" placeholder="e.g. NY"></div></div><p style="color:#4b5563">United States · Results match the city you enter. You can search another city anytime.</p><button id="submit">Find participating stores</button></form><p id="status" role="status" aria-live="polite">Choose a city to get started.</p><div id="results"></div><button id="more" hidden>Show more stores</button><p><a href="join.html">Create an account or sign in</a></p></main><script src="stores.js"></script></body></html>
