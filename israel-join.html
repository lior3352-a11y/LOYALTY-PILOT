<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>הרשמת לקוח · LOYALTY ישראל</title><style>
:root{--bg:#ffffff;--panel:#ffffff;--gold:#d7a23a;--gold2:#edc86f;--text:#151515;--muted:#667085;--line:#e5e7eb;--bad:#9b2c2c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 16% 4%,rgba(237,200,111,.18),transparent 28%),var(--bg);color:var(--text);line-height:1.55}
a{color:inherit;text-decoration:none}.app{width:min(760px,calc(100% - 28px));margin:auto;min-height:100vh;padding:26px 0 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:28px;font-weight:1000;letter-spacing:.8px}.brand i{font-style:normal;color:var(--gold2)}.pill{border:1px solid rgba(201,154,61,.28);color:#8a6417;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900}
.hero{text-align:center;margin:18px auto 22px}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.04;margin:0 0 12px}.hero p{margin:0 auto;color:var(--muted);max-width:610px;font-size:17px}
.card{background:#ffffff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(15,23,42,.08);margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{display:block;font-weight:900;margin:13px 2px 7px}input,select,textarea{width:100%;padding:14px 15px;border:1px solid #d0d5dd;border-radius:14px;font:inherit;background:#ffffff;color:var(--text);outline:none}textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:rgba(237,200,111,.7);box-shadow:0 0 0 4px rgba(237,200,111,.12)}input::placeholder,textarea::placeholder{color:#667085}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 12px}
.tab,.btn{border:1px solid rgba(201,154,61,.28);border-radius:15px;padding:14px 16px;font-weight:1000;font-size:16px;cursor:pointer;background:#ffffff;color:var(--text);text-align:center}.tab.active,.btn.gold{background:var(--gold2);color:#10141b;border-color:var(--gold2)}.btn{width:100%;display:inline-flex;align-items:center;justify-content:center;margin-top:14px}.btn.secondary{background:#ffffff;color:#8a6417}.btn:disabled{opacity:.55;cursor:default}
.notice{border:1px solid rgba(201,154,61,.22);background:#fff9ea;border-radius:16px;padding:13px 15px;margin:14px 0;color:#8a6417}.msg{margin-top:14px;padding:12px 13px;border-radius:13px}.ok{background:#eaf8f1;color:#086b42}.bad{background:#fff0f0;color:var(--bad)}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#ffffff;border-radius:15px;padding:13px 14px}.row b{display:block}.amount{font-weight:1000;color:#8a6417}.footer{text-align:center;color:#667085;font-size:12px;margin-top:22px}
@media(max-width:560px){.top{align-items:flex-start}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.pill{display:none}}
</style></head>
<body><div class="app">
<div class="top"><a class="brand" href="israel.html">LOYALTY<i>.</i> ישראל</a><a class="pill" href="israel-customer.html">הארנק שלי</a></div>
<section class="hero"><h1>הרשמת לקוח</h1><p>חשבון אחד לצבירת הטבות, כניסה לארנק ומעקב אחרי פעילות אצל עסקים שמחוברים ל-LOYALTY.</p></section>
<div id="businessBox" class="notice hidden"><b id="businessName">עסק</b><div id="businessRate" class="muted"></div></div>
<div class="tabs"><button id="signupTab" class="tab active" type="button" onclick="showMode('signup')">הרשמה</button><button id="loginTab" class="tab" type="button" onclick="showMode('login')">כניסה</button></div>
<div id="signupCard" class="card"><div class="grid">
<div><label for="firstName">שם פרטי</label><input id="firstName" autocomplete="given-name"></div><div><label for="lastName">שם משפחה</label><input id="lastName" autocomplete="family-name"></div>
<div><label for="phone">טלפון נייד</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="050-1234567"></div><div><label for="email">אימייל</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div><label for="password">סיסמה</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="לפחות 8 תווים"></div><div><label for="confirmPassword">אימות סיסמה</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div>
<div class="full"><label for="address">כתובת</label><input id="address" autocomplete="street-address"></div><div><label for="city">עיר</label><input id="city" autocomplete="address-level2"></div>
<div><label for="state">אזור / מחוז</label><input id="state" autocomplete="address-level1" placeholder="ישראל"></div><div><label for="zip">מיקוד</label><input id="zip" inputmode="numeric" autocomplete="postal-code"></div>
<div><label for="birthDate">תאריך לידה</label><input id="birthDate" type="date" autocomplete="bday"></div></div>
<label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input id="terms" type="checkbox" style="width:auto;margin-top:5px"><span>אני מאשר/ת את תנאי השימוש ומדיניות הפרטיות, ושמירת פרטי החשבון לצורך הטבות ואבטחת החשבון.</span></label>
<button id="signupBtn" class="btn gold" onclick="registerCustomer()">פתחו לי חשבון</button><div id="signupMsg"></div><div class="notice">הסיסמה נשמרת בצורה מאובטחת. עסקים לא מקבלים את הסיסמה שלך.</div></div>
<div id="loginCard" class="card hidden"><label for="loginId">אימייל או טלפון</label><input id="loginId" autocomplete="username"><label for="loginPassword">סיסמה</label><input id="loginPassword" type="password" autocomplete="current-password"><button id="loginBtn" class="btn gold" onclick="loginCustomer()">כניסה לארנק</button><div id="loginMsg"></div></div>
<div class="footer">LOYALTY ישראל · הרשמת לקוח</div></div>
<script>
const params=new URLSearchParams(location.search),businessId=Number(params.get('business_id')||0);if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}
function showMode(mode){var signup=mode==='signup';signupCard.classList.toggle('hidden',!signup);loginCard.classList.toggle('hidden',signup);signupTab.classList.toggle('active',signup);loginTab.classList.toggle('active',!signup)}
function setMsg(el,text,ok){el.className='msg '+(ok?'ok':'bad');el.textContent=text}
async function loadBusiness(){if(!businessId)return;try{var r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_business',business_id:businessId})});var data=await r.json();if(!r.ok||!data.business)return;businessBox.classList.remove('hidden');businessName.textContent='מצטרפים אל '+data.business.name;var reward=data.business.reward_setup||{};businessRate.textContent=reward.active===false?'החשבון יחובר גם לעסק הזה.':(reward.message||('החשבון יחובר גם לעסק הזה · '+Number(data.business.loyalty_rate||0)+'% צבירה'))}catch(e){}}
async function registerCustomer(){var first_name=firstName.value.trim(),last_name=lastName.value.trim(),phoneValue=phone.value.trim(),emailValue=email.value.trim(),pass=password.value,confirm=confirmPassword.value;var payload={action:'register_customer_account',first_name:first_name,last_name:last_name,phone:phoneValue,email:emailValue,password:pass,address:address.value.trim(),city:city.value.trim(),state:state.value.trim(),postal_code:zip.value.trim(),birth_date:birthDate.value||null,terms_accepted:terms.checked,business_id:businessId||null};if(!first_name||!last_name||!phoneValue||!emailValue||!payload.address||!payload.city||!payload.state||!payload.postal_code){setMsg(signupMsg,'נא להשלים את כל פרטי החשבון.',false);return}if(pass.length<8){setMsg(signupMsg,'הסיסמה צריכה להיות לפחות 8 תווים.',false);return}if(pass!==confirm){setMsg(signupMsg,'הסיסמאות לא תואמות.',false);return}if(!terms.checked){setMsg(signupMsg,'צריך לאשר את תנאי השימוש והפרטיות.',false);return}signupBtn.disabled=true;signupBtn.textContent='פותח חשבון...';try{var r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});var data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error||'לא הצלחנו לפתוח חשבון');localStorage.setItem('loyalty_customer_access_token',data.access_token);setMsg(signupMsg,'החשבון נפתח. מעביר לארנק...',true);setTimeout(function(){location.href='israel-customer.html'},500)}catch(e){setMsg(signupMsg,e.message||'לא הצלחנו לפתוח חשבון',false)}finally{signupBtn.disabled=false;signupBtn.textContent='פתחו לי חשבון'}}
async function loginCustomer(){var login=loginId.value.trim(),pass=loginPassword.value;if(!login||!pass){setMsg(loginMsg,'נא להזין אימייל או טלפון וסיסמה.',false);return}loginBtn.disabled=true;loginBtn.textContent='נכנס...';try{var r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'customer_login',login:login,password:pass,business_id:businessId||null})});var data=await r.json();if(!r.ok||!data.access_token)throw new Error(data.error||'הכניסה נכשלה');localStorage.setItem('loyalty_customer_access_token',data.access_token);location.href='israel-customer.html'}catch(e){setMsg(loginMsg,e.message||'הכניסה נכשלה',false)}finally{loginBtn.disabled=false;loginBtn.textContent='כניסה לארנק'}}
if(params.get('mode')==='login')showMode('login');loadBusiness();
</script></body></html>
