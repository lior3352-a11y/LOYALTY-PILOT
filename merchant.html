<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1b2b"><title>LOYALTY קופה</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--green:#14845a;--line:#e2e7ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:720px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px 24px;border-radius:0 0 26px 26px}.brand{font-size:28px;font-weight:900}.hello{margin-top:10px;color:#dbe6f2}.content{padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px rgba(0,0,0,.06)}label{display:block;font-weight:800;margin:12px 0 6px}input,select{width:100%;padding:14px;border:1px solid #cfd7e3;border-radius:12px;font-size:18px;background:#fff}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:var(--navy);color:#fff;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.6}.status{padding:12px 14px;border-radius:13px;margin-top:12px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f7f9fc;border-radius:15px;padding:16px}.metric b{display:block;font-size:28px;margin-top:4px}.small{font-size:13px;color:var(--muted)}
</style></head>
<body><div class="app"><div class="top"><div class="brand">LOYALTY — קופה</div><div class="hello">קפה העיר · טאבלט העסק</div></div><div class="content">
<div class="card"><h2 style="margin-top:0">עסקה חדשה</h2><label>טלפון לקוח</label><input id="phone" value="0549879978" inputmode="tel"><label>סכום קנייה</label><input id="purchase" type="number" min="1" value="100"><label>אחוז צבירה</label><select id="rate"><option>5</option><option>10</option><option selected>12</option></select><button id="btn" class="btn" onclick="submitTx()">אשר עסקה</button><div id="result"></div></div>
<div class="card"><div class="metrics"><div class="metric"><span class="small">יתרת לקוח</span><b id="balance">₪--</b></div><div class="metric"><span class="small">מצב</span><b>LIVE</b></div></div></div>
<div class="card"><div class="small">המסך הזה מיועד לטאבלט של העסק. לאחר אישור עסקה, מסך הלקוח מתעדכן אוטומטית תוך כמה שניות.</div></div>
</div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
async function api(path){const r=await fetch(U+'/rest/v1/'+path,{headers:H});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function rpc(name,payload){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function refreshBalance(){try{const rows=await api('customer?id=eq.1&select=balance');if(rows&&rows.length)document.getElementById('balance').textContent='₪'+Number(rows[0].balance||0).toFixed(2)}catch(e){}}
async function submitTx(){const btn=document.getElementById('btn'),out=document.getElementById('result'),phone=document.getElementById('phone').value.trim(),purchase=Number(document.getElementById('purchase').value||0),rate=Number(document.getElementById('rate').value||0);if(!phone||purchase<=0||rate<=0){out.innerHTML='<div class="status warn">יש להזין פרטי עסקה תקינים.</div>';return}const earned=Number((purchase*rate/100).toFixed(2));btn.disabled=true;btn.textContent='שומר עסקה…';out.innerHTML='<div class="status warn">שולח ל‑Supabase…</div>';try{const id=await rpc('create_loyalty_transaction',{p_phone:phone,p_business_id:1,p_purchase_amount:purchase,p_earned_amount:earned});await new Promise(r=>setTimeout(r,300));await refreshBalance();out.innerHTML='<div class="status ok"><b>העסקה אושרה ✓</b><br>קנייה ₪'+purchase.toFixed(2)+' · צבירה ₪'+earned.toFixed(2)+'<br><span class="small">מספר עסקה '+id+'</span></div>'}catch(e){out.innerHTML='<div class="status warn"><b>העסקה לא נשמרה.</b><br>'+e.message+'</div>'}finally{btn.disabled=false;btn.textContent='אשר עסקה'}}
refreshBalance();
</script></body></html>
