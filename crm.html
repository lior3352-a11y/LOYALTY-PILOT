<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM לקוחות · LOYALTY ישראל</title>
<style>
:root{--bg:#ffffff;--gold:#edc86f;--text:#151515;--muted:#667085;--line:#e5e7eb;--bad:#9b2c2c;--ok:#086b42}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 16% 4%,rgba(237,200,111,.18),transparent 28%),var(--bg);color:var(--text);line-height:1.55}.app{width:min(1060px,calc(100% - 28px));margin:auto;min-height:100vh;padding:26px 0 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.brand{font-size:28px;font-weight:1000}.brand i{font-style:normal;color:var(--gold)}a{color:inherit;text-decoration:none}.pill{border:1px solid rgba(201,154,61,.28);color:#8a6417;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900}.hero{text-align:center;margin:18px auto 22px}.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.04;margin:0 0 12px}.hero p{margin:0 auto;color:var(--muted);max-width:670px;font-size:17px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(15,23,42,.08);margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:24px;color:#8a6417;margin-top:4px}label{display:block;font-weight:900;margin:12px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #d0d5dd;border-radius:13px;font:inherit;background:#fff;color:var(--text)}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:210px}.btn{border:1px solid rgba(201,154,61,.28);border-radius:13px;padding:13px 15px;font-weight:1000;font-size:15px;cursor:pointer;background:#fff;color:#8a6417}.btn.gold{background:var(--gold);color:#10141b;border-color:var(--gold)}.btn:disabled{opacity:.55}.msg{margin-top:12px;padding:11px 13px;border-radius:12px}.ok{background:#eaf8f1;color:var(--ok)}.bad{background:#fff0f0;color:var(--bad)}.hidden{display:none}.customers{display:flex;flex-direction:column;gap:10px}.customer{border:1px solid var(--line);border-radius:16px;padding:15px;background:#fff}.customerHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:18px;font-weight:1000}.meta{color:var(--muted);font-size:13px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:13px;background:#fafafa}.amount{font-weight:1000;color:#8a6417}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}@media(max-width:720px){.grid{grid-template-columns:1fr}.customerHead{flex-direction:column}.btn{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><a class="brand" href="israel.html">LOYALTY<i>.</i> ישראל</a><a class="pill" href="admin.html">מנהל מערכת</a></div>
  <section class="hero"><h1>CRM לקוחות</h1><p>רשימה מרכזית שלך: כל הלקוחות שנרשמו, פרטי קשר, עסקים מחוברים, יתרות ופעילות אחרונה.</p></section>

  <div id="loginCard" class="card">
    <h2>כניסת מנהל</h2>
    <label for="email">אימייל מנהל</label><input id="email" type="email" autocomplete="username">
    <label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password">
    <button id="loginBtn" class="btn gold" style="width:100%;margin-top:14px" onclick="login()">כניסה ל-CRM</button>
    <div id="loginMsg"></div>
  </div>

  <div id="crmArea" class="hidden">
    <div class="card">
      <div class="row"><div class="field"><div class="meta" id="sessionUser"></div></div><button class="btn" onclick="logout()">יציאה</button></div>
    </div>
    <div class="card">
      <div class="row">
        <div class="field"><label for="q">חיפוש לקוח</label><input id="q" placeholder="שם, טלפון, אימייל או עיר" onkeydown="if(event.key==='Enter') loadCustomers()"></div>
        <button class="btn gold" onclick="loadCustomers()">חיפוש / רענון</button>
      </div>
      <div id="status"></div>
    </div>
    <div class="grid">
      <div class="metric"><span>לקוחות</span><b id="totalCustomers">--</b></div>
      <div class="metric"><span>יתרות כוללות</span><b id="totalBalance">₪--</b></div>
      <div class="metric"><span>מחוברים לעסקים</span><b id="linkedCustomers">--</b></div>
    </div>
    <div class="card"><h2>כל הלקוחות</h2><div id="customers" class="customers"></div></div>
  </div>
  <div class="footer">LOYALTY ישראל · CRM לקוחות</div>
</div>
<script>
const TOKEN_KEY='loyalty_crm_admin_token',USER_KEY='loyalty_crm_admin_email';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'₪'+Number(v||0).toFixed(2);
function token(){return localStorage.getItem(TOKEN_KEY)||''}
function setMsg(el,text,ok){el.innerHTML='<div class="msg '+(ok?'ok':'bad')+'">'+esc(text)+'</div>'}
async function post(body){const r=await fetch('/api/crm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'הפעולה נכשלה');return d}
function showLogin(){loginCard.classList.remove('hidden');crmArea.classList.add('hidden')}
function showCrm(email){loginCard.classList.add('hidden');crmArea.classList.remove('hidden');sessionUser.textContent='מחובר כמנהל: '+(email||localStorage.getItem(USER_KEY)||'');loadCustomers()}
async function login(){const emailValue=email.value.trim(),passwordValue=password.value;if(!emailValue||!passwordValue){setMsg(loginMsg,'יש להזין אימייל וסיסמה.',false);return}loginBtn.disabled=true;loginBtn.textContent='נכנס...';try{const d=await post({action:'login',email:emailValue,password:passwordValue});localStorage.setItem(TOKEN_KEY,d.access_token);localStorage.setItem(USER_KEY,d.email||emailValue);showCrm(d.email||emailValue)}catch(e){setMsg(loginMsg,e.message,false)}finally{loginBtn.disabled=false;loginBtn.textContent='כניסה ל-CRM'}}
function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);showLogin()}
function fmtDate(v){if(!v)return 'אין פעילות';try{return new Date(v).toLocaleString('he-IL')}catch{return String(v)}}
function render(rows){totalCustomers.textContent=rows.length;linkedCustomers.textContent=rows.filter(r=>Number(r.business_count||0)>0).length;totalBalance.textContent=money(rows.reduce((s,r)=>s+Number(r.total_balance||0),0));customers.innerHTML=rows.map(r=>{const name=esc((r.first_name||'')+' '+(r.last_name||''));const businesses=Array.isArray(r.businesses)?r.businesses:[];const chips=businesses.length?businesses.map(b=>'<span class="chip">'+esc(b.business_name||('עסק '+b.business_id))+' · <span class="amount">'+money(b.balance)+'</span></span>').join(''):'<span class="chip">לא מחובר לעסק</span>';return '<div class="customer"><div class="customerHead"><div><div class="name">'+name+'</div><div class="meta">'+esc(r.phone)+' · '+esc(r.email)+'</div><div class="meta">'+esc([r.city,r.state,r.postal_code].filter(Boolean).join(', '))+'</div></div><div class="amount">'+money(r.total_balance)+'</div></div><div class="chips">'+chips+'</div><div class="meta" style="margin-top:10px">נרשם: '+fmtDate(r.account_created_at)+' · פעילות אחרונה: '+fmtDate(r.last_activity_at)+'</div></div>'}).join('')||'<div class="meta">אין לקוחות להצגה.</div>'}
async function loadCustomers(){status.innerHTML='<div class="msg ok">טוען לקוחות...</div>';try{const d=await post({action:'customers',token:token(),q:q.value,limit:300});render(d.customers||[]);status.innerHTML=''}catch(e){setMsg(status,e.message,false);if(e.message.includes('Admin')) logout()}}
if(token())showCrm();else showLogin();
</script>
</body>
</html>
