<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOYALTY — System Admin</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--line:#e2e7ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 24px;border-radius:0 0 26px 26px}.brand{font-size:28px;font-weight:900}.sub{margin-top:8px;color:#dbe6f2}.content{padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px rgba(0,0,0,.06)}label{display:block;font-weight:800;margin:10px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cfd7e3;border-radius:12px;font-size:16px;background:#fff}.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:900;background:var(--navy);color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cfd7e3}.btn.gold{background:var(--gold);color:var(--navy)}.btn.danger{background:#fff;color:#9a2b2b;border:1px solid #e5bcbc}.btn:disabled{opacity:.6}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}.status{padding:12px 14px;border-radius:13px;margin-top:12px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.hidden{display:none}.businesses{display:flex;flex-direction:column;gap:10px;margin-top:14px}.biz{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfe}.bizhead,.userrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.bizname{font-size:18px;font-weight:900}.meta,.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.users{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.userrow{padding:9px 0;border-bottom:1px solid #edf0f4}.userrow:last-child{border-bottom:0}.useremail{font-weight:800}.role{display:inline-block;background:#eef2f6;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:6px}@media(max-width:600px){.bizhead,.userrow{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style></head>
<body><div class="app"><div class="top"><div class="brand">LOYALTY — System Admin</div><div class="sub">Manage businesses, users, and system permissions</div></div><div class="content">
<div id="loginCard" class="card"><h2>System Admin sign in</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px" onclick="login()">Sign in</button><div id="loginResult"></div></div>
<div id="adminArea" class="hidden">
<div class="card"><div class="row"><div class="field"><div class="small" id="sessionUser"></div></div><button class="btn secondary" onclick="logout()">Sign out</button></div></div>
<div class="card"><h2>Add business</h2><div class="row"><div class="field"><label>Business name</label><input id="newName" placeholder="For example, City Cafe"></div><div class="field"><label>Earning rate</label><input id="newRate" type="number" min="0" max="100" step="0.01" value="10"></div><button id="addBtn" class="btn gold" onclick="addBusiness()">Add business</button></div><div id="addStatus"></div></div>
<div class="card"><h2>Create new user</h2><div class="row"><div class="field"><label>Email</label><input id="createEmail" type="email" placeholder="owner@example.com"></div><div class="field"><label>Temporary password</label><input id="createPassword" type="password" minlength="8" placeholder="At least 8 characters"></div><div class="field"><label>Select business</label><select id="createBusinessId"><option value="">Loading businesses…</option></select></div><div class="field"><label>Role</label><select id="createRole"><option value="owner">Owner</option><option value="manager">Manager</option><option value="staff">Staff</option></select></div><button id="createUserBtn" class="btn gold" onclick="createUser()"> </button></div><div id="createUserStatus"></div><div class="small" style="margin-top:8px">  Supabase   Business .</div></div>
<div class="card"><h2>Link existing user to business</h2><div class="row"><div class="field"><label>User email</label><input id="linkEmail" type="email" placeholder="owner@example.com"></div><div class="field"><label>Select business</label><select id="linkBusinessId"><option value="">Loading businesses…</option></select></div><div class="field"><label>Role</label><select id="linkRole"><option value="owner">Owner</option><option value="manager">Manager</option><option value="staff">Staff</option></select></div><button id="linkBtn" class="btn gold" onclick="linkUser()"> </button></div><div id="linkStatus"></div></div>
<div class="card"><div class="row"><div class="field"><h2 style="margin:0">All businesses</h2></div><button class="btn secondary" onclick="loadAll()">Refresh</button></div><div id="listStatus"></div><div id="businesses" class="businesses"></div></div>
</div></div></div>
<script>
const TOKEN_KEY='loyalty_admin_access_token';const USER_KEY='loyalty_admin_email';let businessUsers=[],businessesCache=[];
const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const token=()=>localStorage.getItem(TOKEN_KEY)||'';
function saveSession(d,email){if(d?.access_token)localStorage.setItem(TOKEN_KEY,d.access_token);if(email)localStorage.setItem(USER_KEY,email)}
function showLogin(){adminArea.classList.add('hidden');loginCard.classList.remove('hidden')}function showAdmin(){loginCard.classList.add('hidden');adminArea.classList.remove('hidden');sessionUser.textContent='Signed in as Manager: '+(localStorage.getItem(USER_KEY)||'');loadAll()}
function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);showLogin()}
async function refreshSession(){return token()}
async function rpc(name,payload){const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'admin_rpc',name,payload:payload||{}})});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.error||String(d||'The action failed'));return d}
async function ensureAdmin(){if(await rpc('is_system_admin',{})!==true)throw new Error('System Admin permission required')}
async function login(){const btn=loginBtn,out=loginResult,emailV=email.value.trim(),passwordV=password.value;if(!emailV||!passwordV){out.innerHTML='<div class="status warn">Enter an email and password.</div>';return}btn.disabled=true;try{const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:emailV,password:passwordV})});const d=await r.json();if(!r.ok||!d.token)throw new Error(d?.error||'Sign-in failed');saveSession({access_token:d.token},emailV);await ensureAdmin();showAdmin()}catch(e){logout();out.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
async function loadAll(){listStatus.innerHTML='<div class="status warn">Loading data…</div>';try{await ensureAdmin();businessUsers=await rpc('get_system_business_users_secure',{})||[];businessesCache=await rpc('get_system_admin_businesses_secure',{})||[];refreshBusinessSelect();renderBusinesses();listStatus.innerHTML=''}catch(e){listStatus.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}}
function refreshBusinessSelect(){for(const id of ['linkBusinessId','createBusinessId']){const sel=document.getElementById(id),current=sel.value;sel.innerHTML='<option value="">Select business</option>'+businessesCache.map(r=>'<option value="'+Number(r.business_id)+'">'+esc(r.name)+' — Business '+Number(r.business_id)+'</option>').join('');if(current)sel.value=current}}
function renderBusinesses(){if(!businessesCache.length){businesses.innerHTML='<div class="small">No businesses to display.</div>';return}businesses.innerHTML=businessesCache.map(r=>{const users=businessUsers.filter(u=>Number(u.business_id)===Number(r.business_id));const uh=users.length?users.map(u=>'<div class="userrow"><div><span class="useremail">'+esc(u.email||u.user_id)+'</span><span class="role">'+esc(u.role||'')+'</span></div><button class="btn danger" onclick="unlinkUser(\''+esc(u.user_id)+'\',\''+esc(u.email||'')+'\')"> </button></div>').join(''):'<div class="small"> Users .</div>';return '<div class="biz"><div class="bizhead"><div><div class="bizname">'+esc(r.name)+'</div><div class="meta"> Business '+Number(r.business_id)+' · '+Number(r.loyalty_rate||0).toFixed(2).replace(/\.00$/,'')+'% </div></div><div class="meta">Users: '+Number(r.users_count||0)+' · : '+Number(r.transactions_count||0)+'</div></div><div class="actions"><button class="btn secondary" onclick="editBusiness('+Number(r.business_id)+','+JSON.stringify(String(r.name)).replace(/"/g,'&quot;')+','+Number(r.loyalty_rate||0)+')"> </button></div><div class="users"><b> </b>'+uh+'</div></div>'}).join('')}
async function addBusiness(){const name=newName.value.trim(),rate=Number(newRate.value);if(!name||rate<0||rate>100){addStatus.innerHTML='<div class="status warn">Enter a valid name and rate.</div>';return}addBtn.disabled=true;try{const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_business',name,loyalty_rate:rate})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Business creation failed');newName.value='';addStatus.innerHTML='<div class="status ok">Business   -Neon.</div>';await loadAll()}catch(e){addStatus.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}finally{addBtn.disabled=false}}
async function createUser(){const e=createEmail.value.trim(),p=createPassword.value,b=Number(createBusinessId.value),r=createRole.value;if(!e||p.length<8||!b){createUserStatus.innerHTML='<div class="status warn">Enter an email, a password of at least 8 characters, and select a business.</div>';return}createUserBtn.disabled=true;createUserStatus.innerHTML='<div class="status warn">Creating user…</div>';try{const res=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create_user',email:e,password:p,business_id:b,role:r})});const d=await res.json();if(!res.ok)throw new Error(d?.error||'  ');createUserStatus.innerHTML='<div class="status ok"> ��  Business .</div>';createEmail.value='';createPassword.value='';await loadAll()}catch(err){createUserStatus.innerHTML='<div class="status warn">'+esc(err.message)+'</div>'}finally{createUserBtn.disabled=false}}
async function linkUser(){const e=linkEmail.value.trim(),b=Number(linkBusinessId.value),r=linkRole.value;if(!e||!b){linkStatus.innerHTML='<div class="status warn">Enter an email and select a business.</div>';return}linkBtn.disabled=true;try{await rpc('link_system_user_to_business_secure',{p_email:e,p_business_id:b,p_role:r});linkEmail.value='';linkStatus.innerHTML='<div class="status ok">User linked to the business.</div>';await loadAll()}catch(err){linkStatus.innerHTML='<div class="status warn">'+esc(err.message)+'</div>'}finally{linkBtn.disabled=false}}
async function unlinkUser(id,e){if(!confirm('Remove '+e+' ?'))return;try{await rpc('unlink_system_user_secure',{p_user_id:id});loadAll()}catch(err){alert(err.message)}}
async function editBusiness(id,name,rate){const n=prompt('Business name',name);if(n===null)return;const rr=prompt('Earning rate',String(rate));if(rr===null)return;const v=Number(rr);if(!n.trim()||!Number.isFinite(v)||v<0||v>100){alert('Invalid data');return}await rpc('update_system_business_secure',{p_business_id:id,p_name:n.trim(),p_loyalty_rate:v});loadAll()}
(async()=>{if(token()){try{await ensureAdmin();showAdmin()}catch(e){logout()}}else showLogin()})();
</script></body></html>
