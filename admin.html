<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e1b2b"><title>LOYALTY — מנהל מערכת</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--line:#e2e7ee;--ok:#14845a}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 24px;border-radius:0 0 26px 26px}.brand{font-size:28px;font-weight:900}.sub{margin-top:8px;color:#dbe6f2}.content{padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px rgba(0,0,0,.06)}label{display:block;font-weight:800;margin:10px 0 6px}input{width:100%;padding:13px;border:1px solid #cfd7e3;border-radius:12px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:900;background:var(--navy);color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cfd7e3}.btn.gold{background:var(--gold);color:var(--navy)}.btn:disabled{opacity:.6}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}.status{padding:12px 14px;border-radius:13px;margin-top:12px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.hidden{display:none}.businesses{display:flex;flex-direction:column;gap:10px;margin-top:14px}.biz{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfe}.bizhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.bizname{font-size:18px;font-weight:900}.meta{font-size:13px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.small{font-size:13px;color:var(--muted)}@media(max-width:600px){.bizhead{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="app"><div class="top"><div class="brand">LOYALTY — מנהל מערכת</div><div class="sub">ניהול עסקים והרשאות מערכת</div></div><div class="content">
<div id="loginCard" class="card"><h2 style="margin-top:0">כניסת מנהל מערכת</h2><label>אימייל</label><input id="email" type="email" autocomplete="username"><label>סיסמה</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px" onclick="login()">כניסה</button><div id="loginResult"></div></div>
<div id="adminArea" class="hidden">
<div class="card"><div class="row"><div class="field"><div class="small" id="sessionUser"></div></div><button class="btn secondary" onclick="logout()">התנתקות</button></div></div>
<div class="card"><h2 style="margin-top:0">הוספת עסק</h2><div class="row"><div class="field"><label>שם העסק</label><input id="newName" placeholder="לדוגמה קפה העיר"></div><div class="field"><label>אחוז צבירה</label><input id="newRate" type="number" min="0" max="100" step="0.01" value="10"></div><button id="addBtn" class="btn gold" onclick="addBusiness()">הוסף עסק</button></div><div id="addStatus"></div><div class="small" style="margin-top:8px">הוספת משתמש/בעל עסק תתווסף בשלב הבא.</div></div>
<div class="card"><div class="row"><div class="field"><h2 style="margin:0">כל העסקים</h2></div><button class="btn secondary" onclick="loadBusinesses()">רענן</button></div><div id="listStatus"></div><div id="businesses" class="businesses"></div></div>
</div></div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';const TOKEN_KEY='loyalty_admin_access_token';const REFRESH_KEY='loyalty_admin_refresh_token';const USER_KEY='loyalty_admin_email';let refreshPromise=null;
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function token(){return localStorage.getItem(TOKEN_KEY)||''}function headers(){return {apikey:K,Authorization:'Bearer '+token(),'Content-Type':'application/json'}}
function saveSession(d,email){if(d?.access_token)localStorage.setItem(TOKEN_KEY,d.access_token);if(d?.refresh_token)localStorage.setItem(REFRESH_KEY,d.refresh_token);if(email)localStorage.setItem(USER_KEY,email)}
function showLogin(){document.getElementById('adminArea').classList.add('hidden');document.getElementById('loginCard').classList.remove('hidden')}
function showAdmin(){document.getElementById('loginCard').classList.add('hidden');document.getElementById('adminArea').classList.remove('hidden');document.getElementById('sessionUser').textContent='מחובר כמנהל: '+(localStorage.getItem(USER_KEY)||'');loadBusinesses()}
function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY);localStorage.removeItem(USER_KEY);showLogin()}
async function refreshSession(){if(refreshPromise)return refreshPromise;const rt=localStorage.getItem(REFRESH_KEY)||'';if(!rt)throw new Error('אין אסימון רענון');refreshPromise=(async()=>{try{const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const d=await r.json();if(!r.ok||!d.access_token)throw new Error('רענון החיבור נכשל');saveSession(d);return d.access_token}finally{refreshPromise=null}})();return refreshPromise}
async function rpc(name,payload){if(!token())await refreshSession();let r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(payload||{})});if(r.status===401){await refreshSession();r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(payload||{})})}if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function ensureAdmin(){const ok=await rpc('is_system_admin',{});if(ok!==true)throw new Error('אין הרשאת מנהל מערכת')}
async function login(){const btn=document.getElementById('loginBtn'),out=document.getElementById('loginResult'),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){out.innerHTML='<div class="status warn">יש להזין אימייל וסיסמה.</div>';return}btn.disabled=true;out.innerHTML='';try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok||!d.access_token)throw new Error(d?.msg||d?.message||'הכניסה נכשלה');saveSession(d,email);await ensureAdmin();showAdmin()}catch(e){logout();out.innerHTML='<div class="status warn"><b>הכניסה נכשלה.</b><br>'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
async function loadBusinesses(){const s=document.getElementById('listStatus'),box=document.getElementById('businesses');s.innerHTML='<div class="status warn">טוען עסקים…</div>';box.innerHTML='';try{await ensureAdmin();const rows=await rpc('get_system_admin_businesses_secure',{});s.innerHTML='';if(!Array.isArray(rows)||!rows.length){box.innerHTML='<div class="small">אין עסקים להצגה.</div>';return}box.innerHTML=rows.map(r=>'<div class="biz"><div class="bizhead"><div><div class="bizname">'+esc(r.name)+'</div><div class="meta">מספר עסק '+Number(r.business_id)+' · '+Number(r.loyalty_rate||0).toFixed(2).replace(/\.00$/,'')+'% צבירה</div></div><div class="meta">משתמשים: '+Number(r.users_count||0)+' · עסקאות: '+Number(r.transactions_count||0)+'</div></div><div class="actions"><button class="btn secondary" onclick="editBusiness('+Number(r.business_id)+','+JSON.stringify(String(r.name)).replace(/"/g,'&quot;')+','+Number(r.loyalty_rate||0)+')">עריכה</button></div></div>').join('')}catch(e){s.innerHTML='<div class="status warn"><b>לא ניתן לטעון עסקים.</b><br>'+esc(e.message)+'</div>'}}
async function addBusiness(){const btn=document.getElementById('addBtn'),s=document.getElementById('addStatus'),name=document.getElementById('newName').value.trim(),rate=Number(document.getElementById('newRate').value);if(!name||rate<0||rate>100){s.innerHTML='<div class="status warn">יש להזין שם ואחוז צבירה תקין.</div>';return}btn.disabled=true;try{const d=await rpc('create_system_business_secure',{p_name:name,p_loyalty_rate:rate});s.innerHTML='<div class="status ok">העסק נוסף בהצלחה. מספר עסק '+esc(d?.business_id??'')+'</div>';document.getElementById('newName').value='';loadBusinesses()}catch(e){s.innerHTML='<div class="status warn"><b>העסק לא נוסף.</b><br>'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
async function editBusiness(id,name,rate){const newName=prompt('שם העסק',name);if(newName===null)return;const newRateRaw=prompt('אחוז צבירה',String(rate));if(newRateRaw===null)return;const newRate=Number(newRateRaw);if(!newName.trim()||!Number.isFinite(newRate)||newRate<0||newRate>100){alert('נתונים לא תקינים');return}try{await rpc('update_system_business_secure',{p_business_id:id,p_name:newName.trim(),p_loyalty_rate:newRate});loadBusinesses()}catch(e){alert('העדכון נכשל: '+e.message)}}
(async()=>{if(token()||localStorage.getItem(REFRESH_KEY)){try{await ensureAdmin();showAdmin()}catch(e){logout()}}else showLogin()})();
</script></body></html>
