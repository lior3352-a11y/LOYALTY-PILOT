<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOYALTY — מנהל מערכת</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--line:#e2e7ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:980px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:28px 24px;border-radius:0 0 26px 26px}.brand{font-size:28px;font-weight:900}.sub{margin-top:8px;color:#dbe6f2}.content{padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px rgba(0,0,0,.06)}label{display:block;font-weight:800;margin:10px 0 6px}input,select{width:100%;padding:13px;border:1px solid #cfd7e3;border-radius:12px;font-size:16px;background:#fff}.btn{border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:900;background:var(--navy);color:#fff;cursor:pointer}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cfd7e3}.btn.gold{background:var(--gold);color:var(--navy)}.btn.danger{background:#fff;color:#9a2b2b;border:1px solid #e5bcbc}.btn:disabled{opacity:.6}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{flex:1;min-width:180px}.status{padding:12px 14px;border-radius:13px;margin-top:12px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.hidden{display:none}.businesses{display:flex;flex-direction:column;gap:10px;margin-top:14px}.biz{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fbfcfe}.bizhead,.userrow{display:flex;justify-content:space-between;gap:12px;align-items:center}.bizname{font-size:18px;font-weight:900}.meta,.small{font-size:13px;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.users{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.userrow{padding:9px 0;border-bottom:1px solid #edf0f4}.userrow:last-child{border-bottom:0}.useremail{font-weight:800}.role{display:inline-block;background:#eef2f6;border-radius:999px;padding:4px 8px;font-size:12px;margin-right:6px}@media(max-width:600px){.bizhead,.userrow{align-items:flex-start;flex-direction:column}.btn{width:100%}}
</style></head>
<body><div class="app"><div class="top"><div class="brand">LOYALTY — מנהל מערכת</div><div class="sub">ניהול עסקים, משתמשים והרשאות מערכת</div></div><div class="content">
<div id="loginCard" class="card"><h2>כניסת מנהל מערכת</h2><label>אימייל</label><input id="email" type="email"><label>סיסמה</label><input id="password" type="password"><button id="loginBtn" class="btn" style="width:100%;margin-top:14px" onclick="login()">כניסה</button><div id="loginResult"></div></div>
<div id="adminArea" class="hidden">
<div class="card"><div class="row"><div class="field"><div class="small" id="sessionUser"></div></div><button class="btn secondary" onclick="logout()">התנתקות</button></div></div>
<div class="card"><h2>הוספת עסק</h2><div class="row"><div class="field"><label>שם העסק</label><input id="newName" placeholder="לדוגמה קפה העיר"></div><div class="field"><label>אחוז צבירה</label><input id="newRate" type="number" min="0" max="100" step="0.01" value="10"></div><button id="addBtn" class="btn gold" onclick="addBusiness()">הוסף עסק</button></div><div id="addStatus"></div></div>
<div class="card"><h2>יצירת משתמש חדש</h2><div class="row"><div class="field"><label>אימייל</label><input id="createEmail" type="email" placeholder="owner@example.com"></div><div class="field"><label>סיסמה זמנית</label><input id="createPassword" type="password" minlength="8" placeholder="לפחות 8 תווים"></div><div class="field"><label>בחר עסק</label><select id="createBusinessId"><option value="">טוען עסקים…</option></select></div><div class="field"><label>תפקיד</label><select id="createRole"><option value="owner">בעלים</option><option value="manager">מנהל</option><option value="staff">עובד</option></select></div><button id="createUserBtn" class="btn gold" onclick="createUser()">צור משתמש</button></div><div id="createUserStatus"></div><div class="small" style="margin-top:8px">המשתמש ייווצר ב־Supabase ויקושר אוטומטית לעסק שבחרת.</div></div>
<div class="card"><h2>קישור משתמש קיים לעסק</h2><div class="row"><div class="field"><label>אימייל המשתמש</label><input id="linkEmail" type="email" placeholder="owner@example.com"></div><div class="field"><label>בחר עסק</label><select id="linkBusinessId"><option value="">טוען עסקים…</option></select></div><div class="field"><label>תפקיד</label><select id="linkRole"><option value="owner">בעלים</option><option value="manager">מנהל</option><option value="staff">עובד</option></select></div><button id="linkBtn" class="btn gold" onclick="linkUser()">קשר משתמש</button></div><div id="linkStatus"></div></div>
<div class="card"><div class="row"><div class="field"><h2 style="margin:0">כל העסקים</h2></div><button class="btn secondary" onclick="loadAll()">רענן</button></div><div id="listStatus"></div><div id="businesses" class="businesses"></div></div>
</div></div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';const TOKEN_KEY='loyalty_admin_access_token';const REFRESH_KEY='loyalty_admin_refresh_token';const USER_KEY='loyalty_admin_email';let refreshPromise=null,businessUsers=[],businessesCache=[];
const esc=v=>String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
const token=()=>localStorage.getItem(TOKEN_KEY)||'';const headers=()=>({apikey:K,Authorization:'Bearer '+token(),'Content-Type':'application/json'});
function saveSession(d,email){if(d?.access_token)localStorage.setItem(TOKEN_KEY,d.access_token);if(d?.refresh_token)localStorage.setItem(REFRESH_KEY,d.refresh_token);if(email)localStorage.setItem(USER_KEY,email)}
function showLogin(){adminArea.classList.add('hidden');loginCard.classList.remove('hidden')}function showAdmin(){loginCard.classList.add('hidden');adminArea.classList.remove('hidden');sessionUser.textContent='מחובר כמנהל: '+(localStorage.getItem(USER_KEY)||'');loadAll()}
function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(REFRESH_KEY);localStorage.removeItem(USER_KEY);showLogin()}
async function refreshSession(){if(refreshPromise)return refreshPromise;const rt=localStorage.getItem(REFRESH_KEY)||'';if(!rt)throw new Error('אין אסימון רענון');refreshPromise=(async()=>{try{const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const d=await r.json();if(!r.ok||!d.access_token)throw new Error('רענון החיבור נכשל');saveSession(d);return d.access_token}finally{refreshPromise=null}})();return refreshPromise}
async function rpc(name,payload){if(!token())await refreshSession();let r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(payload||{})});if(r.status===401){await refreshSession();r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:headers(),body:JSON.stringify(payload||{})})}if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function ensureAdmin(){if(await rpc('is_system_admin',{})!==true)throw new Error('אין הרשאת מנהל מערכת')}
async function login(){const btn=loginBtn,out=loginResult,emailV=email.value.trim(),passwordV=password.value;if(!emailV||!passwordV){out.innerHTML='<div class="status warn">יש להזין אימייל וסיסמה.</div>';return}btn.disabled=true;try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:emailV,password:passwordV})});const d=await r.json();if(!r.ok||!d.access_token)throw new Error(d?.msg||d?.message||'הכניסה נכשלה');saveSession(d,emailV);await ensureAdmin();showAdmin()}catch(e){logout();out.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}finally{btn.disabled=false}}
async function loadAll(){listStatus.innerHTML='<div class="status warn">טוען נתונים…</div>';try{await ensureAdmin();businessUsers=await rpc('get_system_business_users_secure',{})||[];businessesCache=await rpc('get_system_admin_businesses_secure',{})||[];refreshBusinessSelect();renderBusinesses();listStatus.innerHTML=''}catch(e){listStatus.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}}
function refreshBusinessSelect(){for(const id of ['linkBusinessId','createBusinessId']){const sel=document.getElementById(id),current=sel.value;sel.innerHTML='<option value="">בחר עסק</option>'+businessesCache.map(r=>'<option value="'+Number(r.business_id)+'">'+esc(r.name)+' — עסק '+Number(r.business_id)+'</option>').join('');if(current)sel.value=current}}
function renderBusinesses(){if(!businessesCache.length){businesses.innerHTML='<div class="small">אין עסקים להצגה.</div>';return}businesses.innerHTML=businessesCache.map(r=>{const users=businessUsers.filter(u=>Number(u.business_id)===Number(r.business_id));const uh=users.length?users.map(u=>'<div class="userrow"><div><span class="useremail">'+esc(u.email||u.user_id)+'</span><span class="role">'+esc(u.role||'')+'</span></div><button class="btn danger" onclick="unlinkUser(\''+esc(u.user_id)+'\',\''+esc(u.email||'')+'\')">הסר מהעסק</button></div>').join(''):'<div class="small">אין משתמשים מקושרים.</div>';return '<div class="biz"><div class="bizhead"><div><div class="bizname">'+esc(r.name)+'</div><div class="meta">מספר עסק '+Number(r.business_id)+' · '+Number(r.loyalty_rate||0).toFixed(2).replace(/\.00$/,'')+'% צבירה</div></div><div class="meta">משתמשים: '+Number(r.users_count||0)+' · עסקאות: '+Number(r.transactions_count||0)+'</div></div><div class="actions"><button class="btn secondary" onclick="editBusiness('+Number(r.business_id)+','+JSON.stringify(String(r.name)).replace(/"/g,'&quot;')+','+Number(r.loyalty_rate||0)+')">עריכת עסק</button></div><div class="users"><b>משתמשי העסק</b>'+uh+'</div></div>'}).join('')}
async function addBusiness(){const name=newName.value.trim(),rate=Number(newRate.value);if(!name||rate<0||rate>100){addStatus.innerHTML='<div class="status warn">יש להזין שם ואחוז תקין.</div>';return}addBtn.disabled=true;try{await rpc('create_system_business_secure',{p_name:name,p_loyalty_rate:rate});newName.value='';addStatus.innerHTML='<div class="status ok">העסק נוסף.</div>';await loadAll()}catch(e){addStatus.innerHTML='<div class="status warn">'+esc(e.message)+'</div>'}finally{addBtn.disabled=false}}
async function createUser(){const e=createEmail.value.trim(),p=createPassword.value,b=Number(createBusinessId.value),r=createRole.value;if(!e||p.length<8||!b){createUserStatus.innerHTML='<div class="status warn">יש להזין אימייל, סיסמה של 8 תווים לפחות ולבחור עסק.</div>';return}createUserBtn.disabled=true;createUserStatus.innerHTML='<div class="status warn">יוצר משתמש…</div>';try{const res=await fetch(U+'/functions/v1/create-business-user',{method:'POST',headers:headers(),body:JSON.stringify({email:e,password:p,business_id:b,role:r})});const d=await res.json();if(!res.ok)throw new Error(d?.error||'יצירת המשתמש נכשלה');createUserStatus.innerHTML='<div class="status ok">המשתמש נוצר וקושר לעסק בהצלחה.</div>';createEmail.value='';createPassword.value='';await loadAll()}catch(err){createUserStatus.innerHTML='<div class="status warn">'+esc(err.message)+'</div>'}finally{createUserBtn.disabled=false}}
async function linkUser(){const e=linkEmail.value.trim(),b=Number(linkBusinessId.value),r=linkRole.value;if(!e||!b){linkStatus.innerHTML='<div class="status warn">יש להזין אימייל ולבחור עסק.</div>';return}linkBtn.disabled=true;try{await rpc('link_system_user_to_business_secure',{p_email:e,p_business_id:b,p_role:r});linkEmail.value='';linkStatus.innerHTML='<div class="status ok">המשתמש קושר לעסק.</div>';await loadAll()}catch(err){linkStatus.innerHTML='<div class="status warn">'+esc(err.message)+'</div>'}finally{linkBtn.disabled=false}}
async function unlinkUser(id,e){if(!confirm('להסיר את '+e+' מהעסק?'))return;try{await rpc('unlink_system_user_secure',{p_user_id:id});loadAll()}catch(err){alert(err.message)}}
async function editBusiness(id,name,rate){const n=prompt('שם העסק',name);if(n===null)return;const rr=prompt('אחוז צבירה',String(rate));if(rr===null)return;const v=Number(rr);if(!n.trim()||!Number.isFinite(v)||v<0||v>100){alert('נתונים לא תקינים');return}await rpc('update_system_business_secure',{p_business_id:id,p_name:n.trim(),p_loyalty_rate:v});loadAll()}
(async()=>{if(token()||localStorage.getItem(REFRESH_KEY)){try{await ensureAdmin();showAdmin()}catch(e){logout()}}else showLogin()})();
</script></body></html>
