<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>LOYALTY לקוח</title><style>
:root{--ink:#172033;--muted:#7b8494;--gold:#c89a3d;--bg:#f6f7fa;--line:#e6e9ef;--green:#13815d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#fff 0,#f6f7fa 55%);padding-bottom:28px}.top{padding:26px 18px 8px}.brand{font-size:28px;font-weight:900;letter-spacing:2px}.brand span{color:var(--gold)}.hello{margin-top:18px;font-size:18px;font-weight:800}.muted{color:var(--muted);font-size:13px}.balanceCard{margin:16px 18px 0;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;box-shadow:0 16px 40px rgba(23,32,51,.07)}.balanceLabel{font-size:13px;color:var(--muted)}.balance{font-size:50px;font-weight:900;margin:5px 0 15px}.status{padding:11px 12px;border-radius:13px;font-size:13px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.content{padding:14px 18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(23,32,51,.05)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.business{display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:#fff7e3;color:#9a741d;border:1px solid #ead8a7;display:grid;place-items:center;font-weight:900;font-size:21px}.amount{font-size:24px;font-weight:900}.perk{font-size:12px;color:#9a741d;font-weight:800;margin-top:4px}.sectionTitle{font-size:17px;font-weight:900;margin-bottom:10px}.live{background:#fbfcfd}.pulse{font-weight:800;margin-top:7px}.history{padding:14px 0;border-bottom:1px solid var(--line)}.history:last-child{border-bottom:0}.earn{color:var(--green);font-size:18px;font-weight:900}.badge{display:inline-block;margin-top:5px;background:#eef8f4;color:#0b7350;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.footer{text-align:center;color:#9aa1ad;font-size:11px;padding:4px 18px 22px}</style></head><body><div class="app"><div class="top"><div class="brand">LOYALTY<span>.</span></div><div class="hello" id="hello">שלום 👋</div><div class="muted">הארנק האישי שלך</div></div><div class="balanceCard"><div class="balanceLabel">היתרה הזמינה שלך</div><div class="balance" id="total">₪--</div><div id="status" class="status warn">מתחבר…</div></div><div class="content"><div class="card"><div class="row"><div class="business"><div class="logo">ק</div><div><b>קפה העיר</b><div class="perk">12% צבירה בכל קנייה</div></div></div><div class="amount" id="businessBalance">₪--</div></div></div><div class="card live"><div class="sectionTitle">עדכון חי</div><div class="muted">הארנק מתעדכן אוטומטית.</div><div class="pulse" id="lastUpdate">ממתין לעדכון…</div></div><div class="card"><div class="sectionTitle">פעולות אחרונות</div><div id="history"><div class="muted">טוען…</div></div></div></div><div class="footer">LOYALTY · הארנק שלך זמין מכל טלפון</div></div><script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};const token=new URLSearchParams(location.search).get('token');async function rpc(name,payload){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}let lastBalance=null;async function refresh(){const s=document.getElementById('status');if(!token){s.className='status warn';s.textContent='חסר מפתח ארנק. יש להיכנס דרך דף ההצטרפות.';document.getElementById('history').innerHTML='<div class="muted">אין גישה לארנק.</div>';return}try{const wallet=await rpc('get_customer_wallet',{p_token:token});if(!wallet||!wallet.length)throw new Error('ארנק לא נמצא');const c=wallet[0],bal=Number(c.balance||0);document.getElementById('hello').textContent='שלום '+(c.name||'לקוח')+' 👋';document.getElementById('total').textContent='₪'+bal.toFixed(2);document.getElementById('businessBalance').textContent='₪'+bal.toFixed(2);document.getElementById('lastUpdate').textContent=lastBalance!==null&&bal!==lastBalance?'היתרה עודכנה עכשיו: ₪'+lastBalance.toFixed(2)+' → ₪'+bal.toFixed(2):'עדכון אחרון: '+new Date().toLocaleTimeString('he-IL');lastBalance=bal;s.className='status ok';s.textContent='מחובר לארנק האישי ✓';const tx=await rpc('get_customer_transactions',{p_token:token});document.getElementById('history').innerHTML=tx&&tx.length?tx.map(x=>'<div class="history row"><span><b>קפה העיר</b><br><span class="muted">קנייה ₪'+Number(x.purchase_amount||0).toFixed(2)+'</span><br><span class="badge">צבירה</span></span><span class="earn">+₪'+Number(x.earned_amount||0).toFixed(2)+'</span></div>').join(''):'<div class="muted">אין עסקאות להצגה</div>'}catch(e){s.className='status warn';s.textContent='שגיאה בטעינת הארנק: '+e.message;document.getElementById('history').innerHTML='<div class="muted">היסטוריה לא זמינה כרגע.</div>'}}refresh();setInterval(refresh,3000);
</script></body></html>
