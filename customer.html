<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1b2b"><title>LOYALTY לקוח</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--green:#14845a;--line:#e2e7ee}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:480px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:24px 18px 28px;border-radius:0 0 26px 26px}.brand{font-size:26px;font-weight:900}.hello{margin-top:12px;color:#dbe6f2}.small{font-size:13px;color:var(--muted)}.top .small{color:#cbd6e2}.balance{font-size:46px;font-weight:900;margin-top:8px}.content{padding:16px}.card{background:#fff;border-radius:20px;padding:17px;margin-bottom:14px;box-shadow:0 7px 22px rgba(0,0,0,.06)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.business{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.amount{font-size:22px;font-weight:900}.status{padding:11px 13px;border-radius:13px;margin-top:12px;font-size:14px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.pulse{font-weight:800}.history{padding:12px 0;border-bottom:1px solid var(--line)}
</style></head>
<body><div class="app">
<div class="top"><div class="brand">LOYALTY</div><div class="hello" id="hello">שלום ליאור 👋</div><div class="small">יתרה חיה מהמסד</div><div class="balance" id="total">₪--</div><div id="status" class="status warn">מתחבר…</div></div>
<div class="content">
<div class="card"><div class="row"><div class="business"><div class="logo">ק</div><div><b>קפה העיר</b><div class="small">חבר מועדון · 12% צבירה</div></div></div><div class="amount" id="businessBalance">₪--</div></div></div>
<div class="card"><b>עדכון אוטומטי</b><p class="small">המסך בודק את היתרה כל 3 שניות. בצע עסקה בטאבלט ותראה את היתרה מתעדכנת כאן.</p><div class="pulse" id="lastUpdate">ממתין לעדכון…</div></div>
<div class="card"><h3 style="margin-top:0">פעולות אחרונות</h3><div id="history"><div class="small">טוען…</div></div></div>
</div></div>
<script>
const SUPABASE_URL='https://haiewlmvnzpryneaszdd.supabase.co';
const SUPABASE_KEY='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';
const headers={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};
async function api(path){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{headers});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
let lastBalance=null;
async function refresh(){const s=document.getElementById('status');try{const rows=await api('customer?id=eq.1&select=id,name,balance');if(!rows||!rows.length)throw new Error('לקוח לא נמצא');const c=rows[0],bal=Number(c.balance||0);document.getElementById('hello').textContent='שלום '+(c.name||'ליאור')+' 👋';document.getElementById('total').textContent='₪'+bal.toFixed(2);document.getElementById('businessBalance').textContent='₪'+bal.toFixed(2);if(lastBalance!==null&&bal!==lastBalance){document.getElementById('lastUpdate').textContent='היתרה עודכנה עכשיו: ₪'+lastBalance.toFixed(2)+' → ₪'+bal.toFixed(2)}else{document.getElementById('lastUpdate').textContent='עדכון אחרון: '+new Date().toLocaleTimeString('he-IL')}lastBalance=bal;s.className='status ok';s.textContent='מחובר ל‑Supabase ✓';}catch(e){s.className='status warn';s.textContent='שגיאת חיבור: '+e.message}
try{const tx=await api('transactions?customer_id=eq.1&select=id,purchase_amount,earned_amount,created_at&order=id.desc&limit=5');document.getElementById('history').innerHTML=tx&&tx.length?tx.map(x=>'<div class="history row"><span>קפה העיר<br><span class="small">קנייה ₪'+Number(x.purchase_amount||0).toFixed(2)+'</span></span><b style="color:#14845a">+₪'+Number(x.earned_amount||0).toFixed(2)+'</b></div>').join(''):'<div class="small">אין עסקאות להצגה</div>';}catch(e){document.getElementById('history').innerHTML='<div class="small">היסטוריה לא זמינה כרגע.</div>'}}
refresh();setInterval(refresh,3000);
</script></body></html>
