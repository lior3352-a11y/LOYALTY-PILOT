<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a33"><title>LOYALTY לקוח</title>
<style>
:root{--navy:#071a33;--navy2:#12345b;--gold:#d9aa45;--gold2:#f1d27a;--bg:#f5f1e8;--text:#10233f;--muted:#788397;--green:#14845a;--line:#e9dfcb}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:480px;margin:auto;min-height:100vh;background:linear-gradient(180deg,#071a33 0 340px,#f5f1e8 340px 100%)}.top{color:#fff;padding:28px 20px 74px;text-align:center;position:relative}.crown{color:var(--gold2);font-size:31px}.brand{font-size:32px;font-weight:900;letter-spacing:2px;margin-top:5px}.hello{margin-top:14px;color:#dce5ef;font-size:16px}.wallet-label{font-size:13px;color:#bdc9d7;margin-top:4px}.balance{font-size:54px;font-weight:900;margin-top:9px}.status{padding:11px 13px;border-radius:14px;margin:16px auto 0;font-size:14px;max-width:360px}.ok{background:rgba(236,255,245,.96);color:#086b42;border:1px solid #bce6d2}.warn{background:#fff6e5;color:#7a4b00;border:1px solid #f1d08a}.content{padding:0 16px 24px;margin-top:-44px}.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 9px 28px rgba(13,29,50,.09);border:1px solid rgba(217,170,69,.16)}.gold-card{border:1px solid rgba(217,170,69,.55);background:linear-gradient(145deg,#fffdf7,#fff)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.business{display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,var(--navy2),var(--navy));color:var(--gold2);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:inset 0 0 0 1px rgba(241,210,122,.35)}.amount{font-size:25px;font-weight:900;color:#9a741d}.small{font-size:13px;color:var(--muted)}.perk{color:#98721c;font-weight:800;margin-top:4px}.section-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;margin-bottom:10px}.section-title:before{content:'★';color:var(--gold)}.pulse{font-weight:800;color:var(--navy)}.history{padding:13px 0;border-bottom:1px solid var(--line)}.history:last-child{border-bottom:0}.history b{color:var(--green)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff7df;color:#8a681c;font-size:12px;font-weight:800;margin-top:5px}.footer{text-align:center;color:#8b8f97;font-size:11px;padding:5px 18px 24px}
</style></head>
<body><div class="app">
<div class="top"><div class="crown">♛</div><div class="brand">LOYALTY</div><div class="hello" id="hello">שלום 👋</div><div class="wallet-label">הארנק האישי שלך</div><div class="balance" id="total">₪--</div><div id="status" class="status warn">מתחבר…</div></div>
<div class="content">
<div class="card gold-card"><div class="row"><div class="business"><div class="logo">ק</div><div><b>קפה העיר</b><div class="perk">★ חבר מועדון · 12% צבירה</div></div></div><div class="amount" id="businessBalance">₪--</div></div></div>
<div class="card"><div class="section-title">עדכון חי</div><div class="small">היתרה שלך מתעדכנת אוטומטית כל 3 שניות.</div><div class="pulse" id="lastUpdate" style="margin-top:9px">ממתין לעדכון…</div></div>
<div class="card"><div class="section-title">פעולות אחרונות</div><div id="history"><div class="small">טוען…</div></div></div>
</div><div class="footer">LOYALTY · הנקודות שלך נשמרות בארנק האישי</div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';
const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const token=new URLSearchParams(location.search).get('token');
async function rpc(name,payload){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
let lastBalance=null;
async function refresh(){const s=document.getElementById('status');if(!token){s.className='status warn';s.textContent='חסר מפתח ארנק. יש להיכנס דרך דף ההצטרפות.';document.getElementById('history').innerHTML='<div class="small">אין גישה לארנק.</div>';return}
try{
 const wallet=await rpc('get_customer_wallet',{p_token:token});
 if(!wallet||!wallet.length)throw new Error('ארנק לא נמצא');
 const c=wallet[0],bal=Number(c.balance||0);
 document.getElementById('hello').textContent='שלום '+(c.name||'לקוח')+' 👋';
 document.getElementById('total').textContent='₪'+bal.toFixed(2);
 document.getElementById('businessBalance').textContent='₪'+bal.toFixed(2);
 if(lastBalance!==null&&bal!==lastBalance){document.getElementById('lastUpdate').textContent='היתרה עודכנה עכשיו: ₪'+lastBalance.toFixed(2)+' → ₪'+bal.toFixed(2)}else{document.getElementById('lastUpdate').textContent='עדכון אחרון: '+new Date().toLocaleTimeString('he-IL')}
 lastBalance=bal;s.className='status ok';s.textContent='מחובר לארנק האישי ✓';
 const tx=await rpc('get_customer_transactions',{p_token:token});
 document.getElementById('history').innerHTML=tx&&tx.length?tx.map(x=>'<div class="history row"><span><b style="color:#10233f">קפה העיר</b><br><span class="small">קנייה ₪'+Number(x.purchase_amount||0).toFixed(2)+'</span><br><span class="badge">צבירה</span></span><b>+₪'+Number(x.earned_amount||0).toFixed(2)+'</b></div>').join(''):'<div class="small">אין עסקאות להצגה</div>';
}catch(e){s.className='status warn';s.textContent='שגיאה בטעינת הארנק: '+e.message;document.getElementById('history').innerHTML='<div class="small">היסטוריה לא זמינה כרגע.</div>'}}
refresh();setInterval(refresh,3000);
</script></body></html>
