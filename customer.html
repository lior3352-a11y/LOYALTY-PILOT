<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LOYALTY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>LOYALTY</title>
<style>
:root{--ink:#171b24;--muted:#8b93a1;--line:#eceff3;--soft:#f7f8fa;--gold:#c59a3d;--green:#13785b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:var(--ink)}.app{max-width:480px;min-height:100vh;margin:auto;background:#fff}.head{padding:26px 20px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:26px;font-weight:900;letter-spacing:1.6px}.brand i{font-style:normal;color:var(--gold)}.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:20px}.main{padding:22px 18px 30px}.hello{font-size:15px;color:var(--muted)}.title{font-size:31px;font-weight:900;margin:4px 0 18px}.balanceCard{background:#171b24;color:#fff;border-radius:26px;padding:24px;box-shadow:0 16px 36px rgba(23,27,36,.16)}.balanceLabel{font-size:13px;color:#c8cbd1}.balance{font-size:52px;font-weight:900;margin:5px 0 18px}.businessLine{display:flex;justify-content:space-between;align-items:center;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}.biz{display:flex;align-items:center;gap:11px}.bizLogo{width:42px;height:42px;border-radius:13px;background:#fff;color:#171b24;display:grid;place-items:center;font-weight:900}.earn{font-size:12px;color:#d6d8dd;margin-top:2px}.amount{font-size:20px;font-weight:900}.status{margin-top:12px;text-align:center;font-size:13px;color:var(--green);font-weight:800}.section{margin-top:24px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead b{font-size:17px}.sectionHead span{font-size:12px;color:var(--muted)}.installRow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border-radius:18px;padding:14px 15px}.installText b{display:block;font-size:15px}.installText span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.installBtn{border:0;border-radius:12px;background:#fff;padding:10px 12px;font-weight:900;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.05)}.iosHelp{display:none;margin-top:9px;font-size:12px;color:var(--muted);background:#fafafa;padding:10px;border-radius:12px}.historyCard{border:1px solid var(--line);border-radius:20px;overflow:hidden}.history{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid var(--line)}.history:last-child{border-bottom:0}.history .left{display:flex;align-items:center;gap:11px}.dot{width:36px;height:36px;border-radius:12px;background:#f7f3e8;color:#94701f;display:grid;place-items:center;font-weight:900}.small{font-size:12px;color:var(--muted)}.plus{font-size:17px;font-weight:900;color:var(--green)}.empty{padding:18px;color:var(--muted);font-size:13px}.footer{text-align:center;color:#a0a6b0;font-size:11px;padding:12px 20px 24px}
</style>
</head>
<body><div class="app">
<div class="head"><div class="brand">LOYALTY<i>.</i></div><div class="avatar">👤</div></div>
<main class="main">
<div class="hello" id="hello">שלום 👋</div><div class="title">הארנק שלך</div>
<div class="balanceCard"><div class="balanceLabel">יתרה זמינה</div><div class="balance" id="total">₪--</div><div class="businessLine"><div class="biz"><div class="bizLogo">ק</div><div><b>קפה העיר</b><div class="earn">12% צבירה</div></div></div><div class="amount" id="businessBalance">₪--</div></div></div>
<div id="status" class="status">מתחבר…</div>
<section id="installCard" class="section"><div class="installRow"><div class="installText"><b>הוסף למסך הבית</b><span>פתח את LOYALTY בלחיצה אחת בפעם הבאה</span></div><button id="installBtn" class="installBtn" type="button">הוסף</button></div><div id="iosHelp" class="iosHelp">באייפון: Safari → שיתוף → ״הוסף למסך הבית״.</div></section>
<section class="section"><div class="sectionHead"><b>פעולות אחרונות</b><span id="lastUpdate">מתעדכן...</span></div><div class="historyCard" id="history"><div class="empty">טוען...</div></div></section>
</main><div class="footer">LOYALTY · הארנק הדיגיטלי שלך</div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';
const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';
const H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};
const params=new URLSearchParams(location.search);const urlToken=params.get('token');if(urlToken)localStorage.setItem('loyalty_wallet_token',urlToken);const token=urlToken||localStorage.getItem('loyalty_wallet_token');if(!token){location.replace('join.html?from=wallet');}
async function rpc(name,payload){const r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:H,body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
let lastBalance=null;
async function refresh(){const s=document.getElementById('status');if(!token){s.textContent='מעביר לדף ההצטרפות…';return}try{const wallet=await rpc('get_customer_wallet',{p_token:token});if(!wallet||!wallet.length)throw new Error('ארנק לא נמצא');const c=wallet[0],bal=Number(c.balance||0);document.getElementById('hello').textContent='שלום '+(c.name||'לקוח')+' 👋';document.getElementById('total').textContent='₪'+bal.toFixed(2);document.getElementById('businessBalance').textContent='₪'+bal.toFixed(2);document.getElementById('lastUpdate').textContent=new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});lastBalance=bal;s.textContent='הארנק מחובר ✓';const tx=await rpc('get_customer_transactions',{p_token:token});document.getElementById('history').innerHTML=tx&&tx.length?tx.map(x=>'<div class="history"><div class="left"><div class="dot">₪</div><div><b>קפה העיר</b><div class="small">קנייה ₪'+Number(x.purchase_amount||0).toFixed(2)+'</div></div></div><div class="plus">+₪'+Number(x.earned_amount||0).toFixed(2)+'</div></div>').join(''):'<div class="empty">אין עסקאות עדיין</div>';}catch(e){s.textContent='שגיאה בטעינת הארנק';document.getElementById('history').innerHTML='<div class="empty">היסטוריה לא זמינה כרגע.</div>'}}
let deferredPrompt=null;const installCard=document.getElementById('installCard'),installBtn=document.getElementById('installBtn'),iosHelp=document.getElementById('iosHelp');const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isStandalone)installCard.style.display='none';window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});installBtn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const c=await deferredPrompt.userChoice;deferredPrompt=null;if(c.outcome==='accepted')installCard.style.display='none';return}if(isIOS){iosHelp.style.display='block';return}installBtn.textContent='תפריט → התקנת אפליקציה';});window.addEventListener('appinstalled',()=>installCard.style.display='none');if(isIOS&&!isStandalone)iosHelp.style.display='none';if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});refresh();setInterval(refresh,3000);
</script></body></html>
