<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start with LOYALTY</title><style>:root{--bg:#090b0d;--panel:#15191a;--ink:#f5f4ee;--muted:#9ba39d;--lime:#D4AF37;--gold-hover:#B8922E;--line:#2b332e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}.wrap{max-width:650px;margin:auto;padding:22px 18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;letter-spacing:-.08em}.brand i{color:var(--lime);font-style:normal}.back{color:var(--muted)}.hero{padding:72px 0 30px}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.12em}.hero h1{font-size:58px;line-height:.94;letter-spacing:-.08em;margin:15px 0}.hero p,.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:23px}.price{font-size:34px;font-weight:900;margin:8px 0 22px}.price span{font-size:15px;color:var(--muted)}label{display:block;font-weight:800;margin-top:14px}input,select{width:100%;padding:15px;border-radius:13px;background:#0e1211;border:1px solid var(--line);color:var(--ink);font-size:16px;margin-top:7px}button{border:0;background:var(--lime);color:#10140b;padding:16px;width:100%;border-radius:14px;font-weight:900;font-size:16px;margin-top:20px;cursor:pointer}.fine{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}@media(max-width:500px){.hero h1{font-size:49px}}</style></head><body><main class="wrap"><header class="top"><a class="brand" href="/">LOYAL<i>TY</i></a><a class="back" href="/">Back to home</a></header><section class="hero"><div class="eyebrow">FOR BUSINESS OWNERS</div><h1>Make coming back<br>feel natural.</h1><p>Launch a loyalty loop your customers actually want to use. One QR, one wallet, more reasons to return.</p></section><form class="card" onsubmit="checkout(event)"><div class="eyebrow">FOUNDING PLAN</div><div class="price">$29 <span>/ month</span></div><label for="businessName">Business name</label><input id="businessName" required placeholder="North & Co."><label for="category">Category</label><select id="category"><option>Beauty</option><option>Fashion</option><option>Food / Grocery</option><option>Cosmetics</option></select><label for="email">Owner email</label><input id="email" type="email" required placeholder="you@business.com"><button>Launch my program</button><p class="fine">Cancel anytime. Your QR and dashboard are ready immediately.</p><p class="muted" id="msg"></p></form></main><script>async function checkout(e){e.preventDefault();const body={businessName:businessName.value.trim(),category:category.value,email:email.value.trim()};const r=await fetch('/api/create-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(j.url)location.href=j.url;else msg.textContent=j.error||'Unable to continue.'}</script></body></html>
