<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your LOYALTY is ready</title><style>:root{--bg:#090b0d;--panel:#15191a;--ink:#f5f4ee;--muted:#9ba39d;--lime:#D4AF37;--gold-hover:#B8922E;--line:#2b332e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,sans-serif}.wrap{max-width:800px;margin:auto;padding:22px 18px}.brand{font-size:25px;font-weight:900;letter-spacing:-.08em}.brand i{color:var(--lime);font-style:normal}.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:30px;margin-top:70px;text-align:center}.eyebrow{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.12em}.card h1{font-size:58px;line-height:.92;letter-spacing:-.08em;margin:18px 0}.muted{color:var(--muted)}.qr{width:240px;height:240px;background:#fff;border-radius:20px;padding:10px;margin:20px auto}.btn{display:inline-block;padding:14px 18px;background:var(--lime);color:#10140b;border-radius:999px;font-weight:900;margin-top:18px}code{display:block;text-align:left;overflow:auto;background:#0c100e;border:1px solid var(--line);padding:15px;border-radius:12px;color:var(--lime);margin-top:12px}@media(max-width:500px){.card{margin-top:45px;padding:22px}.card h1{font-size:46px}}</style></head><body><main class="wrap"><div class="brand">LOYAL<i>TY</i></div><section class="card"><div class="eyebrow">PROGRAM READY</div><h1>Give them a reason to come back.</h1><p id="sub" class="muted">Setting up your business…</p><div id="content"></div></section></main><script>async function load(){const q=new URLSearchParams(location.search);let biz=null;if(q.get('biz')){const r=await fetch('/api/business/'+q.get('biz'));if(r.ok)biz=await r.json()}else if(q.get('session_id')){const r=await fetch('/api/business-by-session/'+q.get('session_id'));if(r.ok)biz=await r.json()}if(!biz){sub.textContent='Your payment is confirmed. Setup is still processing — refresh in a few seconds.';return}const claim=location.origin+'/claim.html?biz='+encodeURIComponent(biz.id);sub.textContent=biz.name+' is live.';content.innerHTML='<img class="qr" alt="Business reward QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(claim)+'"><h2>Scan to See What You Earn</h2><p class="muted">Place this code at checkout, on packaging, or in your bio.</p><code>'+claim+'</code><a class="btn" href="/dashboard.html?biz='+encodeURIComponent(biz.id)+'">Open owner dashboard</a>'}load()</script></body></html>
