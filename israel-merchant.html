<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d14"><title>דשבורד עסק · LOYALTY ישראל</title><style>
:root{--bg:#090d14;--panel:#101722;--gold:#d7a23a;--gold2:#edc86f;--text:#f7f7f4;--muted:#aab3c0;--line:rgba(255,255,255,.1);--bad:#9b2c2c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 16% 4%,rgba(237,200,111,.13),transparent 28%),var(--bg);color:var(--text);line-height:1.55}
a{color:inherit;text-decoration:none}.app{width:min(760px,calc(100% - 28px));margin:auto;min-height:100vh;padding:26px 0 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:28px;font-weight:1000;letter-spacing:.8px}.brand i{font-style:normal;color:var(--gold2)}.pill{border:1px solid rgba(237,200,111,.25);color:#f2d58b;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900}
.hero{text-align:center;margin:18px auto 22px}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.04;margin:0 0 12px}.hero p{margin:0 auto;color:var(--muted);max-width:610px;font-size:17px}
.card{background:linear-gradient(180deg,#111925,#0d141f);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.22);margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{display:block;font-weight:900;margin:13px 2px 7px}input,select,textarea{width:100%;padding:14px 15px;border:1px solid rgba(255,255,255,.14);border-radius:14px;font:inherit;background:#0a1018;color:var(--text);outline:none}textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:rgba(237,200,111,.7);box-shadow:0 0 0 4px rgba(237,200,111,.12)}input::placeholder,textarea::placeholder{color:#6f7b8b}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 12px}
.tab,.btn{border:1px solid rgba(237,200,111,.25);border-radius:15px;padding:14px 16px;font-weight:1000;font-size:16px;cursor:pointer;background:rgba(255,255,255,.03);color:var(--text);text-align:center}.tab.active,.btn.gold{background:var(--gold2);color:#10141b;border-color:var(--gold2)}.btn{width:100%;display:inline-flex;align-items:center;justify-content:center;margin-top:14px}.btn.secondary{background:#0a1018;color:#f2d58b}.btn:disabled{opacity:.55;cursor:default}
.notice{border:1px solid rgba(237,200,111,.22);background:rgba(237,200,111,.08);border-radius:16px;padding:13px 15px;margin:14px 0;color:#f0d99b}.msg{margin-top:14px;padding:12px 13px;border-radius:13px}.ok{background:#eaf8f1;color:#086b42}.bad{background:#fff0f0;color:var(--bad)}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:15px;padding:13px 14px}.row b{display:block}.amount{font-weight:1000;color:#f0d080}.footer{text-align:center;color:#6f7b8b;font-size:12px;margin-top:22px}
@media(max-width:560px){.top{align-items:flex-start}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.pill{display:none}}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{border:1px solid var(--line);border-radius:15px;padding:15px;background:rgba(255,255,255,.025)}.metric span{display:block;color:var(--muted);font-size:13px}.metric b{display:block;font-size:25px;color:#f0d080;margin-top:5px}.qr{text-align:center}.qr img{width:240px;max-width:100%;background:white;padding:12px;border-radius:18px}@media(max-width:560px){.metrics{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="top"><a class="brand" href="israel.html">LOYALTY<i>.</i> ישראל</a><a class="pill" href="israel-owner-signup.html">פתיחת עסק</a></div><section class="hero"><h1>דשבורד עסק</h1><p id="businessHello">כניסה וניהול לקוחות, צבירה, מימוש ו-QR.</p></section><div id="loginCard" class="card"><label for="email">אימייל</label><input id="email" type="email" autocomplete="username"><label for="password">סיסמה</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn gold" onclick="login()">כניסה לדשבורד</button><button class="btn secondary" onclick="location.href='israel-owner-signup.html'">פתיחת חשבון עסק</button><div id="loginResult"></div></div><div id="merchantArea" class="hidden"><div class="card"><div class="muted" id="sessionUser"></div><button class="btn secondary" onclick="logout()">יציאה</button></div><div class="card"><h2>נתוני היום</h2><button class="btn secondary" onclick="loadDashboard()">רענון</button><div id="dashboardStatus"></div><div class="metrics"><div class="metric"><span>מכירות היום</span><b id="salesToday">₪--</b></div><div class="metric"><span>הטבות שנצברו</span><b id="earnedToday">₪--</b></div><div class="metric"><span>מימושים</span><b id="redeemedToday">₪--</b></div><div class="metric"><span>עסקאות</span><b id="transactionsToday">--</b></div><div class="metric"><span>לקוחות</span><b id="customersToday">--</b></div><div class="metric"><span>יתרה כוללת</span><b id="totalBalance">₪--</b></div></div></div><div class="card qr"><h2>QR ללקוחות</h2><div id="qrBusinessName" class="muted"></div><p><img id="businessQr" alt="QR להצטרפות לקוחות"></p><div id="businessQrLink" class="muted" style="word-break:break-all"></div><a id="openJoinLink" class="btn gold" target="_blank" rel="noopener">פתיחת דף הרשמת לקוח</a><button class="btn secondary" onclick="copyBusinessQrLink()">העתקת קישור</button><div id="qrShareStatus" class="muted"></div></div><div class="card"><h2>הוספת קנייה</h2><label for="phone">טלפון לקוח</label><input id="phone" type="tel"><label for="purchase">סכום קנייה</label><input id="purchase" type="number" min="0" step="0.01" value="100"><label>אחוז צבירה</label><div class="notice" id="loyaltyRate">טוען...</div><button class="btn gold" onclick="submitTx()">הוספת קנייה</button><div id="result"></div></div><div class="card"><h2>מימוש הטבה</h2><label for="redeemPhone">טלפון לקוח</label><input id="redeemPhone" type="tel"><label for="redeemAmount">סכום למימוש</label><input id="redeemAmount" type="number" min="0" step="0.01" value="20"><button class="btn gold" onclick="redeemPoints()">מימוש</button><div id="redeemResult"></div></div><div class="card"><h2>לקוחות</h2><button class="btn secondary" onclick="loadCustomers()">רענון לקוחות</button><div id="customersStatus"></div><div id="customers" class="list"></div></div><div class="card"><h2>היסטוריית עסקאות</h2><button class="btn secondary" onclick="loadHistory()">רענון היסטוריה</button><div id="historyStatus"></div><div id="history" class="list"></div></div></div><div class="footer">LOYALTY ישראל · דשבורד עסק</div></div><script>
const API='/api/neon',TOKEN_KEY='loyalty_merchant_access_token',USER_KEY='loyalty_merchant_email';let currentBusinessId=0;function token(){return localStorage.getItem(TOKEN_KEY)||''}function esc(v){return String(v??'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}function money(v){return '₪'+Number(v||0).toFixed(2)}async function api(body){var r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});var d=await r.json().catch(function(){return {}});if(!r.ok)throw new Error(d.error||'הבקשה נכשלה');return d}async function rpc(name,payload){return api({action:'merchant_rpc',name:name,payload:payload||{},access_token:token()})}function setBox(el,text,ok){el.innerHTML='<div class="msg '+(ok?'ok':'bad')+'">'+esc(text)+'</div>'}function showLogin(){loginCard.classList.remove('hidden');merchantArea.classList.add('hidden');businessHello.textContent='כניסה וניהול לקוחות, צבירה, מימוש ו-QR.'}function showMerchant(emailValue){loginCard.classList.add('hidden');merchantArea.classList.remove('hidden');sessionUser.textContent='מחובר: '+(emailValue||localStorage.getItem(USER_KEY)||'בעל עסק');loadBusinessProfile();loadDashboard();loadCustomers();loadHistory()}async function login(){var e=email.value.trim(),p=password.value;if(!e||!p){setBox(loginResult,'נא להזין אימייל וסיסמה.',false);return}loginBtn.disabled=true;loginBtn.textContent='נכנס...';try{var d=await api({action:'login',email:e,password:p});if(!d.access_token&&!d.token)throw new Error('הכניסה נכשלה');localStorage.setItem(TOKEN_KEY,d.access_token||d.token);localStorage.setItem(USER_KEY,e);showMerchant(e)}catch(x){setBox(loginResult,x.message,false)}finally{loginBtn.disabled=false;loginBtn.textContent='כניסה לדשבורד'}}function logout(){localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(USER_KEY);currentBusinessId=0;showLogin()}function renderBusinessQr(name){var b=new URL('israel-join.html',location.href);if(currentBusinessId)b.searchParams.set('business_id',currentBusinessId);qrBusinessName.textContent=name||'העסק שלי';businessQrLink.textContent=b.href;openJoinLink.href=b.href;businessQr.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(b.href)}async function loadBusinessProfile(){try{var d=await rpc('business_profile');currentBusinessId=Number(d?.business_id||d?.id||0);var n=d?.name||'העסק שלי',r=Number(d?.loyalty_rate||0);businessHello.textContent=n+' · דשבורד עסק';loyaltyRate.textContent=r+'%';renderBusinessQr(n)}catch(e){renderBusinessQr('העסק שלי');loyaltyRate.textContent='10%'}}async function loadDashboard(){try{var d=await rpc('business_dashboard');salesToday.textContent=money(d.sales_today);earnedToday.textContent=money(d.earned_today);redeemedToday.textContent=money(d.redeemed_today);transactionsToday.textContent=Number(d.transactions_today||0);customersToday.textContent=Number(d.customers_today||0);totalBalance.textContent=money(d.total_customer_balance??d.total_balance);dashboardStatus.innerHTML=''}catch(e){setBox(dashboardStatus,e.message,false)}}async function loadCustomers(){try{var a=await rpc('business_customers'),rows=Array.isArray(a)?a:[];customers.innerHTML=rows.map(function(r){return '<div class="row"><div><b>'+esc(r.name||r.phone||r.customer_id)+'</b><div class="muted">'+esc(r.phone||'')+'</div></div><div class="amount">'+money(r.balance)+'</div></div>'}).join('')||'<div class="muted">אין לקוחות עדיין.</div>';customersStatus.innerHTML=''}catch(e){setBox(customersStatus,e.message,false)}}async function loadHistory(){try{var a=await rpc('business_transactions',{p_limit:20}),rows=Array.isArray(a)?a:[];history.innerHTML=rows.map(function(r){return '<div class="row"><div><b>'+esc(r.name||r.phone||r.type||'עסקה')+'</b><div class="muted">קנייה '+money(r.purchase_amount)+' · '+esc(r.created_at||'')+'</div></div><div class="amount">'+money(r.earned_amount)+'</div></div>'}).join('')||'<div class="muted">אין עסקאות עדיין.</div>';historyStatus.innerHTML=''}catch(e){setBox(historyStatus,e.message,false)}}async function submitTx(){var amount=Number(purchase.value||0),mobile=phone.value.trim();if(!mobile||amount<=0){setBox(result,'נא לבדוק טלפון לקוח וסכום קנייה.',false);return}try{await rpc('create_loyalty_transaction',{p_phone:mobile,p_purchase_amount:amount});setBox(result,'הקנייה נוספה.',true);loadDashboard();loadCustomers();loadHistory()}catch(e){setBox(result,e.message,false)}}async function redeemPoints(){var amount=Number(redeemAmount.value||0),mobile=redeemPhone.value.trim();if(!mobile||amount<=0){setBox(redeemResult,'נא לבדוק טלפון וסכום למימוש.',false);return}try{await rpc('redeem_loyalty_balance',{p_phone:mobile,p_redeem_amount:amount,p_request_id:crypto.randomUUID()});setBox(redeemResult,'ההטבה מומשה.',true);loadDashboard();loadCustomers();loadHistory()}catch(e){setBox(redeemResult,e.message,false)}}async function copyBusinessQrLink(){try{await navigator.clipboard.writeText(businessQrLink.textContent);qrShareStatus.textContent='הקישור הועתק'}catch(e){qrShareStatus.textContent='לא הצלחנו להעתיק'}}if(token())showMerchant();else showLogin();
</script></body></html>
