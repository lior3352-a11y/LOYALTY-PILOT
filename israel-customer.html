<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>הארנק שלי · LOYALTY ישראל</title><style>
:root{--bg:#ffffff;--panel:#ffffff;--gold:#d7a23a;--gold2:#edc86f;--text:#151515;--muted:#667085;--line:#e5e7eb;--bad:#9b2c2c}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 16% 4%,rgba(237,200,111,.18),transparent 28%),var(--bg);color:var(--text);line-height:1.55}
a{color:inherit;text-decoration:none}.app{width:min(760px,calc(100% - 28px));margin:auto;min-height:100vh;padding:26px 0 46px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.brand{font-size:28px;font-weight:1000;letter-spacing:.8px}.brand i{font-style:normal;color:var(--gold2)}.pill{border:1px solid rgba(201,154,61,.28);color:#8a6417;border-radius:999px;padding:9px 13px;font-size:13px;font-weight:900}
.hero{text-align:center;margin:18px auto 22px}.hero h1{font-size:clamp(32px,7vw,54px);line-height:1.04;margin:0 0 12px}.hero p{margin:0 auto;color:var(--muted);max-width:610px;font-size:17px}
.card{background:#ffffff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 14px 40px rgba(15,23,42,.08);margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}
label{display:block;font-weight:900;margin:13px 2px 7px}input,select,textarea{width:100%;padding:14px 15px;border:1px solid #d0d5dd;border-radius:14px;font:inherit;background:#ffffff;color:var(--text);outline:none}textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:rgba(237,200,111,.7);box-shadow:0 0 0 4px rgba(237,200,111,.12)}input::placeholder,textarea::placeholder{color:#667085}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 12px}
.tab,.btn{border:1px solid rgba(201,154,61,.28);border-radius:15px;padding:14px 16px;font-weight:1000;font-size:16px;cursor:pointer;background:#ffffff;color:var(--text);text-align:center}.tab.active,.btn.gold{background:var(--gold2);color:#10141b;border-color:var(--gold2)}.btn{width:100%;display:inline-flex;align-items:center;justify-content:center;margin-top:14px}.btn.secondary{background:#ffffff;color:#8a6417}.btn:disabled{opacity:.55;cursor:default}
.notice{border:1px solid rgba(201,154,61,.22);background:#fff9ea;border-radius:16px;padding:13px 15px;margin:14px 0;color:#8a6417}.msg{margin-top:14px;padding:12px 13px;border-radius:13px}.ok{background:#eaf8f1;color:#086b42}.bad{background:#fff0f0;color:var(--bad)}.muted{color:var(--muted);font-size:13px}.hidden{display:none}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#ffffff;border-radius:15px;padding:13px 14px}.row b{display:block}.amount{font-weight:1000;color:#8a6417}.footer{text-align:center;color:#667085;font-size:12px;margin-top:22px}
@media(max-width:560px){.top{align-items:flex-start}.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}.pill{display:none}}
.balance{background:linear-gradient(145deg,#ffffff,#f8fafc);border:1px solid rgba(201,154,61,.22);border-radius:26px;padding:24px;text-align:center}.balance strong{display:block;font-size:54px;line-height:1;color:#8a6417;margin:8px 0}.headActions{display:flex;gap:8px}.mini{border:1px solid var(--line);background:#ffffff;color:var(--text);border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}</style></head><body><div class="app"><div class="top"><a class="brand" href="israel.html">LOYALTY<i>.</i> ישראל</a><div class="headActions"><a class="mini" href="israel-join.html">הרשמה</a><button class="mini" onclick="logoutCustomer()">יציאה</button></div></div><section class="hero"><h1>הארנק שלי</h1><p id="hello">טוען את החשבון...</p></section><div class="balance"><div class="muted">יתרת הטבות זמינה</div><strong id="total">₪--</strong><div class="muted">בכל העסקים שמחוברים לחשבון שלך</div></div><div id="status" class="msg ok">מתחבר...</div><section class="card"><h2>העסקים שלי</h2><div id="rewards" class="list"><div class="muted">טוען...</div></div></section><section class="card"><h2>פעילות אחרונה</h2><div id="history" class="list"><div class="muted">טוען...</div></div></section><section class="card"><h2>פרטי חשבון</h2><div id="profile" class="grid"><div class="muted">טוען...</div></div></section><section id="installCard" class="card"><h2>הוספה למסך הבית</h2><p class="muted">פתחו את הארנק בלחיצה אחת מהטלפון.</p><button id="installBtn" class="btn secondary">הוספה</button><div id="iosHelp" class="notice hidden">באייפון: Safari → שיתוף → הוסף למסך הבית.</div></section><div class="footer">LOYALTY ישראל · ארנק לקוח</div></div><script>
const token=localStorage.getItem('loyalty_customer_access_token');if(!token){location.replace('israel-join.html?mode=login')}function money(n){return '₪'+Number(n||0).toFixed(2)}function esc(v){return String(v??'').replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
async function refresh(){try{var r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'customer_account'})});var data=await r.json();if(!r.ok||!data.account)throw new Error(data.error||'החשבון לא נמצא');var a=data.account,businesses=data.businesses||[],tx=data.transactions||[];hello.textContent='שלום '+(a.first_name||'');var totalBalance=businesses.reduce(function(sum,x){return sum+Number(x.balance||0)},0);total.textContent=money(totalBalance);rewards.innerHTML=businesses.length?businesses.map(function(x){return '<div class="row"><div><b>'+esc(x.business_name||'עסק')+'</b><div class="muted">'+esc(x.reward_active===false?'הטבות זמינות בחנות':(x.reward_message||Number(x.loyalty_rate||0)+'% צבירה'))+'</div></div><div class="amount">'+money(x.balance)+'</div></div>'}).join(''):'<div class="muted">עדיין אין עסקים מחוברים. אחרי הרשמה דרך QR של עסק, הוא יופיע כאן.</div>';history.innerHTML=tx.length?tx.map(function(x){var earned=Number(x.earned_amount||0),label=x.type==='redeem'?'מימוש הטבה':'קנייה '+money(x.purchase_amount);return '<div class="row"><div><b>'+esc(x.business_name||'עסק')+'</b><div class="muted">'+label+'</div></div><div class="amount">'+(earned>=0?'+':'-')+money(Math.abs(earned))+'</div></div>'}).join(''):'<div class="muted">אין פעילות עדיין.</div>';var items=[['שם',(a.first_name||'')+' '+(a.last_name||'')],['טלפון',a.phone],['אימייל',a.email],['כתובת',[a.address,a.city,a.state,a.postal_code].filter(Boolean).join(', ')],['תאריך לידה',a.birth_date?String(a.birth_date).slice(0,10):'לא הוזן']];profile.innerHTML=items.map(function(i){return '<div><div class="muted">'+i[0]+'</div><b>'+esc(i[1]||'-')+'</b></div>'}).join('');status.className='msg ok';status.textContent='החשבון מחובר'}catch(e){if(String(e.message).toLowerCase().includes('session')||String(e.message).toLowerCase().includes('sign in')){localStorage.removeItem('loyalty_customer_access_token');location.replace('israel-join.html?mode=login');return}status.className='msg bad';status.textContent=e.message||'לא הצלחנו לטעון את החשבון'}}
async function logoutCustomer(){try{await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'customer_logout'})})}catch(e){}localStorage.removeItem('loyalty_customer_access_token');location.replace('israel-join.html?mode=login')}let deferredPrompt=null;const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);if(isStandalone)installCard.style.display='none';window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e});installBtn.addEventListener('click',async function(){if(deferredPrompt){deferredPrompt.prompt();var c=await deferredPrompt.userChoice;deferredPrompt=null;if(c.outcome==='accepted')installCard.style.display='none';return}if(isIOS){iosHelp.classList.remove('hidden');return}installBtn.textContent='דרך תפריט הדפדפן: התקנת אפליקציה'});window.addEventListener('appinstalled',function(){installCard.style.display='none'});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(function(){});refresh();
</script></body></html>
