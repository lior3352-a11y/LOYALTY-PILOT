<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOYALTY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>הצטרפות ל־LOYALTY</title>
<style>
:root{--ink:#172033;--muted:#7b8494;--gold:#c89a3d;--bg:#f7f8fb;--line:#e7e9ee;--green:#0b7a53}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff 0,#f7f8fb 70%);color:var(--ink)}.app{max-width:480px;margin:auto;min-height:100vh;padding:26px 18px 34px}.brand{text-align:center;font-size:30px;font-weight:900;letter-spacing:2px}.dot{color:var(--gold)}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-top:5px}.hero{margin:26px 0 18px;text-align:center}.hero h1{font-size:31px;line-height:1.15;margin:0 0 10px}.hero p{margin:0;color:var(--muted);font-size:16px}.reward{margin:20px 0;background:linear-gradient(135deg,#fffaf0,#fff);border:1px solid #ead8a7;border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:space-between}.reward strong{font-size:28px;color:#9a741d}.reward span{font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 35px rgba(23,32,51,.07)}label{display:block;font-weight:800;margin:14px 2px 7px}input{width:100%;padding:15px 16px;border:1px solid #d9dde5;border-radius:15px;font-size:18px;background:#fbfcfd;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,154,61,.12);background:white}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:16px;background:#172033;color:#fff;font-weight:900;font-size:18px;box-shadow:0 10px 24px rgba(23,32,51,.16)}button:disabled{opacity:.6}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:14px}.msg{margin-top:14px;padding:13px;border-radius:13px;font-size:14px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.bad{background:#fff2e5;color:#8a4b00;border:1px solid #efd1a4}.install-note{margin-top:14px;padding:13px;border-radius:13px;background:#fff8e8;border:1px solid #ead59a;color:#6f581d;font-size:14px;font-weight:700}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.step{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px 6px;text-align:center;font-size:12px;color:var(--muted)}.step b{display:block;color:var(--gold);font-size:18px;margin-bottom:3px}
</style>
<link rel="stylesheet" href="accessibility.css"></head>
<body>
<div class="app">
  <div class="brand">LOYALTY<span class="dot">.</span></div>
  <div class="subtitle">מועדון הלקוחות האישי שלך</div>
  <div class="hero"><h1>מצטרפים. צוברים. חוזרים.</h1><p>הרשמה מהירה וארנק אישי שנפתח מיד בטלפון.</p></div>
  <div class="reward"><span><span id="businessName">טוען את פרטי העסק…</span><br><small style="color:#7b8494">צוברים הטבות בכל רכישה</small></span><strong id="rewardRate">--%</strong></div>
  <div class="card">
    <label>שם מלא</label><input id="name" autocomplete="name" placeholder="השם שלך">
    <label>מספר טלפון</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="050-1234567" dir="ltr">
    <button id="btn" onclick="registerCustomer()" disabled>הצטרפות עכשיו</button>
    <div id="msg"></div>
    <div id="installNote" class="install-note">לאחר ההצטרפות נציע להוסיף את LOYALTY למסך הבית, כדי לפתוח אותו בלחיצה אחת.</div>
    <div class="note">בלי כרטיס. בלי סיסמה.</div>
  </div>
  <div class="steps"><div class="step"><b>1</b>מצטרפים</div><div class="step"><b>2</b>מוסיפים למסך הבית</div><div class="step"><b>3</b>צוברים הטבות</div></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const businessId=Number(params.get('business_id')||0);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
async function loadBusiness(){
 const msg=document.getElementById('msg'),btn=document.getElementById('btn');
 if(!businessId){msg.className='msg bad';msg.textContent='הקישור לעסק אינו תקין.';return}
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_business',business_id:businessId})});
  const data=await r.json();
  if(!r.ok||!data.business)throw new Error(data.error||'העסק לא נמצא');
  document.getElementById('businessName').textContent=data.business.name;
  document.getElementById('rewardRate').textContent=Number(data.business.loyalty_rate||0)+'%';
  document.title='הצטרפות למועדון של '+data.business.name;
  btn.disabled=false;
 }catch(e){msg.className='msg bad';msg.textContent=e.message||'הקישור לעסק אינו זמין.'}
}
async function registerCustomer(){
 const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),btn=document.getElementById('btn'),msg=document.getElementById('msg');
 if(!name||!phone){msg.className='msg bad';msg.textContent='יש להזין שם ומספר טלפון.';return}
 btn.disabled=true;btn.textContent='מצטרפים…';
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register_customer',name,phone,business_id:businessId})});
  const data=await r.json();
  if(!r.ok||!data.token)throw new Error(data.error||'לא התקבל קישור לארנק');
  localStorage.setItem('loyalty_wallet_token',data.token);
  msg.className='msg ok';msg.innerHTML='<b>ההצטרפות הצליחה ✓</b><br>פותחים את הארנק שלך…';
  setTimeout(()=>location.href='customer.html?token='+encodeURIComponent(data.token)+'&v=8',650);
 }catch(e){msg.className='msg bad';msg.textContent='ההצטרפות נכשלה: '+e.message}
 finally{btn.disabled=false;btn.textContent='הצטרפות עכשיו'}
}
loadBusiness();
</script>
<script src="site-common.js"></script></body>
</html>
