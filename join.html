<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a33">
<title>הצטרפות ל-LOYALTY</title>
<style>
:root{--navy:#071a33;--navy2:#12345b;--gold:#d9aa45;--gold2:#f1d27a;--cream:#fbf8f1;--text:#0f2340;--muted:#758096;--line:#eadfca;--green:#0b7a53}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#071a33 0 35%,#f5f1e8 35% 100%);color:var(--text);min-height:100vh}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:28px}.hero{padding:38px 22px 78px;text-align:center;color:white;position:relative}.crown{font-size:34px;color:var(--gold2);line-height:1}.brand{font-size:36px;font-weight:900;letter-spacing:2px;margin-top:8px}.tag{margin-top:8px;color:#d9e3ef;font-size:14px}.card{margin:-44px 16px 0;background:#fff;border-radius:28px;padding:24px 20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.18);border:1px solid rgba(217,170,69,.45)}.title{text-align:center;font-size:28px;font-weight:900;margin:0}.business{text-align:center;margin:9px 0 22px;color:#78612e;font-weight:700}.perk{display:flex;justify-content:center;gap:8px;align-items:center;background:#fff9e8;border:1px solid #ecd898;border-radius:16px;padding:12px;margin-bottom:20px;font-weight:800;color:#775b16}.perk b{font-size:22px;color:#9b741d}label{display:block;font-weight:800;margin:14px 3px 7px}input{width:100%;padding:15px 16px;border:1px solid #d7dce5;border-radius:15px;font-size:18px;background:#fbfcfe;outline:none;transition:.2s}input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,170,69,.15);background:#fff}button{width:100%;margin-top:20px;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#13243a;font-weight:900;font-size:18px;box-shadow:0 8px 20px rgba(217,170,69,.28)}button:disabled{opacity:.65}.msg{margin-top:14px;padding:13px;border-radius:13px;font-size:14px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.bad{background:#fff2e5;color:#8a4b00;border:1px solid #efd1a4}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 16px 0}.step{background:rgba(255,255,255,.92);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 5px 18px rgba(20,30,50,.06);font-size:12px;color:#546176}.step strong{display:block;color:var(--navy);font-size:20px;margin-bottom:5px}.footer{text-align:center;color:#6f7785;font-size:12px;margin-top:18px;padding:0 18px}
</style>
</head>
<body>
<div class="app">
  <div class="hero"><div class="crown">♛</div><div class="brand">LOYALTY</div><div class="tag">המועדון האישי שלך</div></div>
  <div class="card">
    <h1 class="title">מצטרפים ומתחילים לצבור</h1>
    <div class="business">קפה העיר</div>
    <div class="perk">צבירה בכל קנייה <b>12%</b> ★</div>
    <label>השם שלך</label><input id="name" autocomplete="name" placeholder="לדוגמה: נורמה כהן">
    <label>מספר טלפון</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX">
    <button id="btn" onclick="registerCustomer()">הצטרפו ל-LOYALTY</button>
    <div id="msg"></div>
  </div>
  <div class="steps"><div class="step"><strong>1</strong>נרשמים</div><div class="step"><strong>2</strong>צוברים</div><div class="step"><strong>3</strong>נהנים</div></div>
  <div class="footer">ההרשמה מהירה • הארנק נפתח מיד • הנקודות מתעדכנות אוטומטית</div>
</div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';
const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';
async function registerCustomer(){
 const name=document.getElementById('name').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const btn=document.getElementById('btn');
 const msg=document.getElementById('msg');
 if(!name||!phone){msg.className='msg bad';msg.textContent='יש להזין שם וטלפון.';return;}
 btn.disabled=true;btn.textContent='מצרפים אותך…';
 try{
  const r=await fetch(U+'/rest/v1/rpc/register_customer_v2',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_name:name,p_phone:phone})});
  if(!r.ok)throw new Error(await r.text());
  const data=await r.json();
  const token=data&&data.token?data.token:null;
  if(!token)throw new Error('לא התקבל מפתח ארנק');
  msg.className='msg ok';msg.innerHTML='<b>ברוכים הבאים ל-LOYALTY ✓</b><br>פותחים את הארנק האישי שלך…';
  setTimeout(()=>{location.href='customer.html?token='+encodeURIComponent(token)+'&v=3';},700);
 }catch(e){msg.className='msg bad';msg.textContent='הרישום לא הצליח: '+e.message;}
 finally{btn.disabled=false;btn.textContent='הצטרפו ל-LOYALTY';}
}
</script>
</body></html>
