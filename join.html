<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LOYALTY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Create your LOYALTY account</title>
<style>
:root{--ink:#151515;--muted:#747474;--gold:#c89a3d;--bg:#f7f7f7;--line:#e6e6e6;--green:#0b7a53;--red:#9b2c2c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#fff 0,#f5f5f5 72%);color:var(--ink)}.app{max-width:560px;margin:auto;min-height:100vh;padding:28px 18px 42px}.brand{text-align:center;font-size:31px;font-weight:900;letter-spacing:2px}.dot{color:var(--gold)}.subtitle{text-align:center;color:var(--muted);font-size:14px;margin-top:5px}.hero{margin:24px 0 18px;text-align:center}.hero h1{font-size:31px;line-height:1.15;margin:0 0 10px}.hero p{margin:0;color:var(--muted);font-size:15px}.business{display:none;margin:18px 0;background:#fffaf0;border:1px solid #ead8a7;border-radius:18px;padding:14px 16px}.business strong{display:block}.business span{font-size:13px;color:var(--muted)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px;border-radius:13px;font-weight:900;cursor:pointer}.tab.active{background:#171717;color:#fff;border-color:#171717}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 35px rgba(0,0,0,.06)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:800;margin:12px 2px 7px;font-size:14px}input{width:100%;padding:14px 15px;border:1px solid #d9d9d9;border-radius:14px;font-size:16px;background:#fcfcfc;outline:none}input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,154,61,.12);background:white}.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;color:#555}.check input{width:auto;margin-top:2px}.primary{width:100%;margin-top:18px;padding:15px;border:0;border-radius:15px;background:#171717;color:#fff;font-weight:900;font-size:17px;cursor:pointer}.primary:disabled{opacity:.55;cursor:default}.msg{margin-top:14px;padding:12px 13px;border-radius:12px;font-size:14px}.ok{background:#eaf8f1;color:#086b42;border:1px solid #bce6d2}.bad{background:#fff0f0;color:var(--red);border:1px solid #efc8c8}.note{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}.hidden{display:none}.security{margin-top:16px;background:#f7f7f7;border-radius:14px;padding:12px 13px;color:#555;font-size:12px;line-height:1.45}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
<link rel="stylesheet" href="accessibility.css"></head>
<body>
<div class="app">
  <div class="brand">LOYALTY<span class="dot">.</span></div>
  <div class="subtitle">Your rewards account</div>
  <div class="hero"><h1>Create your personal account</h1><p>One secure account for your details, rewards and activity. No QR is required to register.</p></div>
  <div id="businessBox" class="business"><strong id="businessName">Business</strong><span id="businessRate"></span></div>
  <div class="tabs"><button id="signupTab" class="tab active" type="button" onclick="showMode('signup')">Create account</button><button id="loginTab" class="tab" type="button" onclick="showMode('login')">Sign in</button></div>

  <div id="signupCard" class="card">
    <div class="grid">
      <div><label for="firstName">First name</label><input id="firstName" autocomplete="given-name"></div>
      <div><label for="lastName">Last name</label><input id="lastName" autocomplete="family-name"></div>
      <div><label for="phone">Mobile number</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="(555) 123-4567"></div>
      <div><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
      <div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters"></div>
      <div><label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div>
      <div class="full"><label for="address">Street address</label><input id="address" autocomplete="street-address"></div>
      <div><label for="city">City</label><input id="city" autocomplete="address-level2"></div>
      <div><label for="state">State</label><input id="state" autocomplete="address-level1" placeholder="NY"></div>
      <div><label for="zip">ZIP code</label><input id="zip" inputmode="numeric" autocomplete="postal-code"></div>
      <div><label for="birthDate">Date of birth</label><input id="birthDate" type="date" autocomplete="bday"></div>
    </div>
    <label class="check"><input id="terms" type="checkbox"><span>I agree to the Terms of Service and Privacy Policy and consent to LOYALTY storing my account information for rewards and account security.</span></label>
    <button id="signupBtn" class="primary" onclick="registerCustomer()">Create my account</button>
    <div id="signupMsg"></div>
    <div class="security">Your password is stored as a secure password hash. Businesses do not receive your password.</div>
  </div>

  <div id="loginCard" class="card hidden">
    <label for="loginId">Email or mobile number</label><input id="loginId" autocomplete="username">
    <label for="loginPassword">Password</label><input id="loginPassword" type="password" autocomplete="current-password">
    <button id="loginBtn" class="primary" onclick="loginCustomer()">Sign in</button>
    <div id="loginMsg"></div>
    <div class="note">Use the same account on any device.</div>
  </div>
</div>
<script>
const params=new URLSearchParams(location.search);
const businessId=Number(params.get('business_id')||0);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
function showMode(mode){
 const signup=mode==='signup';
 document.getElementById('signupCard').classList.toggle('hidden',!signup);
 document.getElementById('loginCard').classList.toggle('hidden',signup);
 document.getElementById('signupTab').classList.toggle('active',signup);
 document.getElementById('loginTab').classList.toggle('active',!signup);
}
async function loadBusiness(){
 if(!businessId)return;
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_business',business_id:businessId})});
  const data=await r.json();
  if(!r.ok||!data.business)return;
  document.getElementById('businessBox').style.display='block';
  document.getElementById('businessName').textContent='Joining '+data.business.name;
  document.getElementById('businessRate').textContent='Your account will also be connected to this business · '+Number(data.business.loyalty_rate||0)+'% reward rate';
 }catch(_e){}
}
function message(el,text,ok=false){el.className='msg '+(ok?'ok':'bad');el.textContent=text}
async function registerCustomer(){
 const first_name=document.getElementById('firstName').value.trim();
 const last_name=document.getElementById('lastName').value.trim();
 const phone=document.getElementById('phone').value.trim();
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;
 const address=document.getElementById('address').value.trim();
 const city=document.getElementById('city').value.trim();
 const state=document.getElementById('state').value.trim();
 const postal_code=document.getElementById('zip').value.trim();
 const birth_date=document.getElementById('birthDate').value||null;
 const terms_accepted=document.getElementById('terms').checked;
 const btn=document.getElementById('signupBtn'),msg=document.getElementById('signupMsg');
 if(!first_name||!last_name||!phone||!email||!address||!city||!state||!postal_code){message(msg,'Please complete all required account details.');return}
 if(password.length<8){message(msg,'Password must be at least 8 characters.');return}
 if(password!==confirm){message(msg,'Passwords do not match.');return}
 if(!terms_accepted){message(msg,'Please accept the Terms of Service and Privacy Policy.');return}
 btn.disabled=true;btn.textContent='Creating account…';
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register_customer_account',first_name,last_name,phone,email,password,address,city,state,postal_code,birth_date,terms_accepted,business_id:businessId||null})});
  const data=await r.json();
  if(!r.ok||!data.access_token)throw new Error(data.error||'Account could not be created');
  localStorage.setItem('loyalty_customer_access_token',data.access_token);
  message(msg,'Account created. Opening My Rewards…',true);
  setTimeout(()=>location.href='customer.html',500);
 }catch(e){message(msg,e.message||'Account could not be created')}
 finally{btn.disabled=false;btn.textContent='Create my account'}
}
async function loginCustomer(){
 const login=document.getElementById('loginId').value.trim(),password=document.getElementById('loginPassword').value;
 const btn=document.getElementById('loginBtn'),msg=document.getElementById('loginMsg');
 if(!login||!password){message(msg,'Enter your email or mobile number and password.');return}
 btn.disabled=true;btn.textContent='Signing in…';
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'customer_login',login,password,business_id:businessId||null})});
  const data=await r.json();
  if(!r.ok||!data.access_token)throw new Error(data.error||'Sign in failed');
  localStorage.setItem('loyalty_customer_access_token',data.access_token);
  location.href='customer.html';
 }catch(e){message(msg,e.message||'Sign in failed')}
 finally{btn.disabled=false;btn.textContent='Sign in'}
}
loadBusiness();
</script>
<script src="site-common.js"></script></body>
</html>
