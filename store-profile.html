<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Manage store listing — LOYALTY</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1018;color:#f5f5f5;font:17px/1.5 Arial,sans-serif}main{max-width:900px;margin:auto;padding:28px 20px}a{color:#e7c36f}h1{font-size:38px;line-height:1.15}p{color:#b7bfcc}form,.store{background:#fff;color:#162031;border-radius:20px;padding:22px;margin:20px 0}label{display:block;margin:12px 0 6px;font-weight:bold}input,button{font:inherit;padding:13px;border-radius:10px;max-width:100%}input:not([type=checkbox]){width:100%;border:1px solid #a7adba}button{background:#e7c36f;color:#111;border:0;font-weight:bold;cursor:pointer;margin-top:18px}button:disabled{opacity:.6}.store p{color:#4b5563}.store a{color:#755006}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.store{margin:0}.row{display:grid;grid-template-columns:2fr 1fr;gap:16px}:focus-visible{outline:3px solid #b98116;outline-offset:3px}@media(max-width:480px){.row{grid-template-columns:1fr}h1{font-size:32px}}</style></head><body><main><a href="index.html">LOYALTY · Home</a><h1>Your public store listing</h1><p>Use your business location, which will be visible to customers when you enable the listing.</p><form id="profile"><label for="address">Street address</label><input id="address" maxlength="250" required autocomplete="street-address"><label for="city">City or town</label><input id="city" maxlength="100" required autocomplete="address-level2"><label for="state">US state code</label><input id="state" maxlength="2" pattern="[A-Za-z]{2}" required autocomplete="address-level1"><label><input id="listed" type="checkbox"> Show my business in the public store directory</label><button id="save" disabled>Save listing</button></form><p id="status" role="status">Loading your listing…</p><a href="merchant.html">Back to business dashboard</a></main><script src="store-profile.js"></script></body></html>
