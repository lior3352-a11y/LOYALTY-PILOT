<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOYALTY — בדיקת קופה</title>
<style>
body{margin:0;background:#eef2f6;font-family:Arial,sans-serif;color:#14213d}.app{max-width:680px;margin:auto;padding:20px}.top{background:#0e1b2b;color:white;padding:24px;border-radius:0 0 24px 24px;margin:-20px -20px 20px}.card{background:white;padding:20px;border-radius:18px;margin:14px 0;box-shadow:0 6px 18px rgba(0,0,0,.06)}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccd5e0;border-radius:10px;font-size:18px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#0e1b2b;color:white;font-weight:800;font-size:17px;margin-top:14px}.gold{background:#d7a23a;color:#0e1b2b}.ok,.err{padding:12px;border-radius:10px;margin-top:12px}.ok{background:#e8f7ef;color:#086b42}.err{background:#fff0dc;color:#7a4b00}.hidden{display:none}.small{font-size:13px;color:#667085}
</style>
</head>
<body><div class="app">
<div class="top"><h1 style="margin:0">LOYALTY — קופה</h1><div style="margin-top:8px">בדיקת עסק 1 — קפה העיר</div></div>
<div id="login" class="card"><h2>כניסת בעל עסק</h2><label>אימייל</label><input id="email" type="email" value="lior3352@gmail.com"><label>סיסמה</label><input id="password" type="password"><button class="btn" onclick="doLogin()">כניסה</button><div id="loginMsg"></div></div>
<div id="area" class="hidden">
<div class="card"><div id="who" class="small"></div><button class="btn" onclick="logout()">התנתקות</button></div>
<div class="card"><h2>עסקה חדשה</h2><label>טלפון לקוח</label><input id="phone" inputmode="tel" value="0549879978"><label>סכום קנייה</label><input id="amount" type="number" value="10" min="1"><button class="btn" onclick="createTx()">אשר עסקה</button><div id="txMsg"></div></div>
<div class="card"><h2>מימוש נקודות</h2><label>טלפון לקוח</label><input id="rphone" inputmode="tel" value="0549879978"><label>סכום למימוש</label><input id="ramount" type="number" value="5" min="0.01" step="0.01"><button class="btn gold" onclick="redeem()">ממש נקודות</button><div id="redeemMsg"></div></div>
</div></div>
<script>
const U='https://haiewlmvnzpryneaszdd.supabase.co';
const K='sb_publishable_eJKsXaMr0GCSqa5AVNoe1A_NPsWqXHk';
const BUSINESS_ID=1;
let token='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rid(){return crypto.randomUUID?crypto.randomUUID():'req-'+Date.now()}
async function doLogin(){const e=email.value.trim(),p=password.value;loginMsg.innerHTML='';try{let r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});let d=await r.json();if(!r.ok||!d.access_token)throw new Error(d.message||d.msg||'הכניסה נכשלה');token=d.access_token;login.classList.add('hidden');area.classList.remove('hidden');who.textContent='מחובר: '+e}catch(x){loginMsg.innerHTML='<div class="err">'+esc(x.message)+'</div>'}}
async function rpc(name,body){let r=await fetch(U+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});let t=await r.text();if(!r.ok)throw new Error(t);return t?JSON.parse(t):null}
async function createTx(){txMsg.innerHTML='';try{const p=phone.value.trim(),a=Number(amount.value);const d=await rpc('create_loyalty_transaction_secure',{p_phone:p,p_business_id:BUSINESS_ID,p_purchase_amount:a});txMsg.innerHTML='<div class="ok"><b>העסקה אושרה ✓</b><br>מספר עסקה: '+esc(d?.transaction_id??'')+'<br>נצבר: ₪'+Number(d?.earned_amount||0).toFixed(2)+'<br>יתרה: ₪'+Number(d?.balance||0).toFixed(2)+'</div>'}catch(x){txMsg.innerHTML='<div class="err"><b>העסקה לא נשמרה</b><br>'+esc(x.message)+'</div>'}}
async function redeem(){redeemMsg.innerHTML='';try{const p=rphone.value.trim(),a=Number(ramount.value);const d=await rpc('redeem_loyalty_balance_secure',{p_phone:p,p_redeem_amount:a,p_request_id:rid()});redeemMsg.innerHTML='<div class="ok"><b>המימוש אושר ✓</b><br>מומש: ₪'+Number(d?.redeemed_amount||a).toFixed(2)+'<br>יתרה: ₪'+Number(d?.balance||0).toFixed(2)+'</div>'}catch(x){redeemMsg.innerHTML='<div class="err"><b>המימוש נכשל</b><br>'+esc(x.message)+'</div>'}}
function logout(){token='';area.classList.add('hidden');login.classList.remove('hidden')}
</script></body></html>
