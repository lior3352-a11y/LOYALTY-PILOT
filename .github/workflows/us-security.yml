name: US security release checks
on:
  pull_request:
    paths:
      - 'api/**'
      - 'lib/**'
      - 'migrations/**'
      - 'tests/**'
      - '*.html'
      - '*.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/us-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: loyalty_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECURITY_TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/loyalty_security_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
