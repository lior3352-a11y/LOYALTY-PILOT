<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1b2b">
<title>פתיחת חשבון עסקי — LOYALTY</title>
<style>
:root{--navy:#0e1b2b;--navy2:#203a5a;--gold:#d7a23a;--bg:#eef2f6;--text:#14213d;--muted:#667085;--line:#e2e7ee}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{max-width:720px;margin:auto;min-height:100vh;background:#f7f9fc}.top{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px 24px;border-radius:0 0 26px 26px}.brand{font-size:28px;font-weight:900}.hello{margin-top:10px;color:#dbe6f2}.content{padding:20px}.card{background:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 7px 22px rgba(0,0,0,.06)}label{display:block;font-weight:800;margin:12px 0 6px}input{width:100%;padding:14px;border:1px solid #cfd7e3;border-radius:12px;font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:900;background:var(--navy);color:#fff;cursor:pointer;margin-top:14px}.btn.secondary{background:#fff;color:var(--navy);border:1px solid #cfd7e3}.btn:disabled{opacity:.6}.status{padding:12px 14px;border-radius:13px;margin-top:12px}.ok{background:#eaf8f1;color:#086b42}.warn{background:#fff6e5;color:#7a4b00}.small{font-size:13px;color:var(--muted)}.price{font-size:34px;font-weight:900;color:var(--gold);margin:6px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="accessibility.css"></head>
<body>
<div class="app"><div class="top"><div class="brand">LOYALTY — לעסקים</div><div class="hello">פתיחת חשבון לעסק</div></div><div class="content"><div class="card">
<h2>מצטרפים ל־LOYALTY</h2><div class="small">פתחו חשבון עסקי והתחילו תקופת ניסיון של 14 יום.</div>
<label>שם העסק</label><input id="businessName" autocomplete="organization" placeholder="שם העסק שלך">
<div class="row"><div><label>אימייל</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" dir="ltr"></div><div><label>טלפון</label><input id="phone" type="tel" autocomplete="tel" placeholder="050-1234567" dir="ltr"></div></div>
<label>סיסמה</label><input id="password" type="password" autocomplete="new-password" placeholder="לפחות 8 תווים">
<label>אימות סיסמה</label><input id="confirmPassword" type="password" autocomplete="new-password" placeholder="הקלידו את הסיסמה שוב">
<label class="terms-consent"><input id="acceptTerms" type="checkbox"> <span>קראתי ואני מסכים/ה ל<a href="terms.html" target="_blank" rel="noopener">תנאי השימוש</a>.</span></label>
<button id="signupBtn" class="btn" onclick="signup()">פתיחת חשבון עסקי</button>
<button class="btn secondary" onclick="location.href='merchant.html'">כבר יש לך חשבון? כניסה</button><div id="result"></div>
</div></div></div>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function signup(){
 const name=businessName.value.trim(),emailValue=email.value.trim(),phoneValue=phone.value.trim(),passwordValue=password.value,confirmValue=confirmPassword.value;
 if(!name||!emailValue||!passwordValue){result.innerHTML='<div class="status warn">יש למלא את שם העסק, האימייל והסיסמה.</div>';return}
 if(passwordValue.length<8){result.innerHTML='<div class="status warn">הסיסמה חייבת להכיל לפחות 8 תווים.</div>';return}
 if(passwordValue!==confirmValue){result.innerHTML='<div class="status warn">הסיסמאות אינן תואמות.</div>';return}
 if(!acceptTerms.checked){result.innerHTML='<div class="status warn">יש לאשר את תנאי השימוש.</div>';return}
 signupBtn.disabled=true;signupBtn.textContent='פותח חשבון…';
 try{
  const r=await fetch('/api/neon',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'register_business',name,email:emailValue,password:passwordValue,phone:phoneValue,terms_accepted:true})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(data.error||data.message||'לא ניתן היה לפתוח את החשבון העסקי');
  if(data.access_token)localStorage.setItem('loyalty_merchant_access_token',data.access_token);
  localStorage.setItem('loyalty_merchant_email',emailValue);
  result.innerHTML='<div class="status ok"><b>החשבון נפתח בהצלחה.</b><br>מעבירים אותך ללוח הבקרה…</div>';
  setTimeout(()=>location.href='merchant.html',700);
 }catch(e){result.innerHTML='<div class="status warn"><b>פתיחת החשבון נכשלה.</b><br>'+esc(e.message)+'</div>'}
 finally{signupBtn.disabled=false;signupBtn.textContent='פתיחת חשבון עסקי'}
}
</script>
<script src="site-common.js"></script></body></html>
